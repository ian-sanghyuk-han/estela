<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ESTELA — globe foundation. Map-only 3D globe (country fills + vector borders +
     tiered labels for countries/cities). Forked from after-flight/index.html,
     which was seeded from batavia-wtl labs/globe-base.html v4
     (dateline unwrap + polar cap fixes included).
     Canon-guide star layers (§3) and the journey line (§5.3) mount on top of this base.
     Rendering engine: three.js r160 + topojson-client, both via CDN.

     v0.2 — three view modes (GLOBE / MAP / JOURNEY), ported from
     batavia-wtl site/index.html. The morph works because the base is NOT a sphere:
     it is one PlaneGeometry grid whose every vertex is lerped between a wrapped
     (spherical) and an unfolded (flat) position. Borders, labels, city dots and the
     journey trail all carry the same p0/p1 pair, so the whole stage folds as one.
     The JOURNEY sample trail uses CITY coordinates only — no guide data of any kind
     is present in this file (§4, §F). -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estela — Globe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500&family=Archivo:wght@400;500;600&display=swap">
<style>
  /* ── Direction C + olive. Wine is me, olive is together, ink is the map. ── */
  :root{
    --paper:#F2EEE6; --card:#FFFFFF; --sand:#E4DED2;
    --ink:#1B1714;   --dim:#6B6259;  --mute:#8C8175;
    --rule:rgba(27,23,20,.13);
    --wine:#7A2233;  --olive:#6E7355;
    --serif:Newsreader,Georgia,serif; --sans:Archivo,'Helvetica Neue',sans-serif;
  }
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    overflow:hidden;height:100vh;height:100dvh}
  #hud{position:fixed;top:10px;left:12px;z-index:5;font:11px/1.7 var(--sans);color:var(--dim);
    background:rgba(255,255,255,.72);border:1px solid var(--rule);padding:7px 12px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #hud b{color:var(--ink);font-weight:600}
  #hud .wm{font-family:var(--serif);font-size:14px;letter-spacing:3.4px;color:var(--ink)}
  #note{position:fixed;bottom:10px;left:12px;right:12px;z-index:5;font:10px var(--sans);color:var(--dim)}
  /* ── 뷰 전환 바 ── */
  #modebar{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);z-index:6;display:flex;
    background:rgba(255,255,255,.82);border:1px solid rgba(27,23,20,.20);
    padding:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .mbtn{font:500 11.5px/1 var(--sans);letter-spacing:2px;color:var(--dim);
    padding:11px 20px;cursor:pointer;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;transition:color .3s,background .3s}
  .mbtn+.mbtn{border-left:1px solid var(--rule)}
  .mbtn.on{color:var(--paper);background:var(--ink);font-weight:600}
  /* ── 여정 = 여권 한 페이지 ── */
  #jpanel{position:fixed;top:12px;right:12px;z-index:6;width:286px;max-height:calc(100vh - 24px);overflow-y:auto;
    background:var(--card);border:1px solid var(--rule);padding:15px 16px 13px;
    font:11px/1.55 var(--sans);color:var(--dim);
    box-shadow:0 10px 30px rgba(27,23,20,.10);
    opacity:0;transform:translateY(-6px);pointer-events:none;
    transition:opacity .45s ease,transform .45s ease}
  #jpanel.on{opacity:1;transform:none;pointer-events:auto}
  #jpanel h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:5px;color:var(--ink)}
  #jpanel .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  #jpanel .tag{font-size:8.5px;letter-spacing:1.6px;font-weight:600;color:var(--card);
    background:var(--mute);padding:3px 8px}
  /* 도장판 */
  #jstops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stamp{aspect-ratio:1;border:1.5px solid var(--wine);color:var(--wine);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    text-align:center;transform:rotate(var(--r));transform-origin:50% 50%}
  .stamp .n{font-family:var(--serif);font-size:11.5px;font-weight:500;line-height:1.12;padding:0 2px;
    overflow-wrap:anywhere}   /* COPENHAGEN·SAN SEBASTIÁN 같은 긴 이름도 칸 안에서 접힌다 */
  .stamp .d{font-size:8px;letter-spacing:.6px;opacity:.82}
  /* 함께 간 도장에는 올리브 겹도장이 하나 더 찍힌다 */
  .stamp.tg{border-color:var(--olive);color:var(--olive);box-shadow:2.5px 2.5px 0 rgba(110,115,85,.22)}
  .stamp.empty{border:1.5px dashed rgba(140,129,117,.65);color:var(--dim);transform:none}
  .stamp.float{border-style:dashed;border-color:rgba(140,129,117,.8);color:var(--dim)}
  /* 찍히는 순간 — 위에서 내려와 눌린다 */
  #jpanel.on .stamp{animation:press .5s cubic-bezier(.16,1.02,.3,1) backwards}
  @keyframes press{
    0%  {opacity:0;transform:rotate(var(--r)) scale(2.1)}
    55% {opacity:1;transform:rotate(var(--r)) scale(.94)}
    75% {transform:rotate(var(--r)) scale(1.03)}
    100%{opacity:1;transform:rotate(var(--r)) scale(1)}}
  @media (prefers-reduced-motion:reduce){#jpanel.on .stamp{animation:none}}
  #jpanel .foot{color:var(--dim);font-size:9.5px;margin-top:11px;padding-top:9px;
    border-top:1px solid var(--rule);line-height:1.6}
  #jpanel .key{display:flex;gap:10px;margin-top:7px;font-size:9.5px;color:var(--dim)}
  #jpanel .key i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
  #jpanel .sw{width:9px;height:9px;border:1.5px solid var(--wine);display:inline-block}
  #jpanel .sw.o{border-color:var(--olive)}
  #jpanel .sw.g{border-style:dashed;border-color:rgba(140,129,117,.7)}
  @media (max-width:560px){
    #jpanel{width:auto;left:12px;right:12px;top:auto;bottom:86px;transform:translateY(6px)}
    #jpanel.on{transform:none}
    #jstops{grid-template-columns:repeat(4,minmax(0,1fr))}
    #hud{font-size:10px;padding:6px 10px}
    .mbtn{padding:12px 16px}
  }
</style>
</head>
<body>
<div id="hud"><span class="wm">ESTELA</span> — 미식 별 레이어는 이 위에 얹습니다<br>
FPS <b id="fps">—</b> · 국가 <b id="ncty">—</b> · 경계 <b id="res">110m</b> · <span id="hint">드래그 회전 / 휠·핀치 줌</span></div>

<div id="modebar">
  <span class="mbtn on" data-v="3d">3D</span>
  <span class="mbtn" data-v="2d">지도</span>
  <span class="mbtn" data-v="journey">여정</span>
</div>

<div id="jpanel">
  <div class="head"><h3>여정</h3><span class="tag">샘플 · 실제 기록 아님</span></div>
  <div id="jstops"></div>
  <div class="key">
    <i><span class="sw"></span>혼자</i>
    <i><span class="sw o"></span>함께</i>
    <i><span class="sw g"></span>날짜 미상</i>
  </div>
  <div class="foot">찍힌 순서가 곧 여정입니다. 날짜를 모르는 별은 선에 꿰이지 않고 혼자 떠 있습니다.<br>
    지구본 위 올리브 고리 = 함께 간 별 · 끊긴 고리 = 여럿이 따로 다녀온 별.</div>
</div>

<div id="note">estela — P0 시작 베이스 (after-flight에서 분기 · 원류 batavia globe-base v4) · 여정은 샘플 도시 좌표이며 가이드 데이터 없음</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"topojson-client":"https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as topojson from 'topojson-client';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);
camera.position.set(0,0.5,2.9);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(1.75,devicePixelRatio));
renderer.setClearColor(0xF2EEE6);        /* 종이 */
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=1.4;controls.maxDistance=5.5;controls.enablePan=false;
const AUTOROT=!matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotate=AUTOROT;
controls.autoRotateSpeed=.22;

/* ══ 투영: '3d' 구 | '2d' 평면 — 같은 정점이 감기고 펼쳐진다 (모핑의 심장) ══ */
const R=1;
const D2R=Math.PI/180;
const W2=4,H2=2;                       /* 펼친 지도의 폭·높이 */
let VIEW='3d',MODE='3d',MORPH=0;       /* MORPH 0=구 · 1=평면 */
function sphV3(la,lo,r){const phi=(90-la)*D2R,th=(lo+180)*D2R;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(th));}
function flatV3(la,lo,r){return new THREE.Vector3(lo/180*(W2/2),la/90*(H2/2),(r-R)*2.2);}
function blendV3(la,lo,r,k){return sphV3(la,lo,r).lerp(flatV3(la,lo,r),k);}
function toV3(la,lo,r){return blendV3(la,lo,r,MORPH);}
function setLerpGeo(geo,p0,p1,k){      /* 정점 배열 두 벌 사이를 선형 보간 (CPU) */
  const a=geo.attributes.position.array;
  for(let i=0;i<a.length;i++)a[i]=p0[i]+(p1[i]-p0[i])*k;
  geo.attributes.position.needsUpdate=true;
  geo.computeBoundingSphere();}
/* 선(국경·해안선·여정선)은 정점이 15만 개라 CPU로 접으면 폰에서 버벅인다.
   두 자리를 attribute 두 벌로 넘겨두고 그래픽카드가 직접 섞게 한다 — CPU 비용 0 */
function lineMat(color,opacity,onTop){
  return new THREE.ShaderMaterial({
    transparent:true,depthTest:!onTop,depthWrite:false,
    uniforms:{uC:{value:new THREE.Color(color)},uO:{value:opacity},uK:{value:MORPH}},
    vertexShader:'attribute vec3 aP1;uniform float uK;void main(){'+
      'vec3 p=mix(position,aP1,uK);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}',
    fragmentShader:'uniform vec3 uC;uniform float uO;void main(){gl_FragColor=vec4(uC,uO);}'});}
function setLineK(l,k){if(l)l.material.uniforms.uK.value=k;}
function setLineO(l,o){if(l)l.material.uniforms.uO.value=o;}

/* 배경 별은 뺐다 — 바탕이 종이가 된 이상 하늘의 별은 식당 별과 헷갈릴 뿐이다.
   이 화면에서 별은 오직 다녀온 식당을 뜻한다 */

/* ── 무대: 지도에 붙는 모든 것이 여기 담긴다 (통째로 접히고 펼쳐진다) ── */
const stage=new THREE.Group();scene.add(stage);
let stageClones=[];
function refreshClones(){ /* 지도 모드: 좌우 복제 — 끝이 없는 지도 */
  stageClones.forEach(c=>scene.remove(c));
  stageClones=[];
  if(VIEW!=='2d')return;
  [-W2,W2].forEach(off=>{
    const c=stage.clone(true);         /* 재질·기하는 공유되므로 페이드가 함께 먹는다 */
    c.position.x=off;scene.add(c);stageClones.push(c);});}

/* ── 바탕: 구가 아니라 격자다. 같은 정점이 구로 감기고 평면으로 펼쳐진다 ── */
const baseMat=new THREE.MeshBasicMaterial({color:0xE2DACB,side:THREE.DoubleSide});
const baseGeo=new THREE.PlaneGeometry(W2,H2,192,96);
const BP0=new Float32Array(baseGeo.attributes.position.count*3);
const BP1=new Float32Array(baseGeo.attributes.position.count*3);
{const pos=baseGeo.attributes.position;
 for(let i=0;i<pos.count;i++){
   const x=pos.getX(i),y=pos.getY(i);
   const lo=x/(W2/2)*180,la=y/(H2/2)*90;
   const s=sphV3(la,lo,R);
   BP0[i*3]=s.x;BP0[i*3+1]=s.y;BP0[i*3+2]=s.z;
   BP1[i*3]=x;BP1[i*3+1]=y;BP1[i*3+2]=0;}}
const baseMesh=new THREE.Mesh(baseGeo,baseMat);
setLerpGeo(baseGeo,BP0,BP1,0);
stage.add(baseMesh);

/* 종이 위에서는 파란 대기광이 어색하다. 대신 구 바깥으로 옅은 그림자를 깔아
   지구본이 종이에서 살짝 떠 보이게 한다 — 3D 전용이라 펼쳐지면 알파로 물러난다 */
const atmMat=new THREE.ShaderMaterial({
  transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.NormalBlending,
  uniforms:{c:{value:new THREE.Color(0x6B6259)},a:{value:1}},
  vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 c;uniform float a;varying vec3 vN;void main(){'+
    'float d=dot(vN,vec3(0.,0.,1.));float i=pow(clamp(.62-d,0.,1.),2.2)*smoothstep(0.,.30,-d);'+
    'gl_FragColor=vec4(c,clamp(i*.34*a,0.,1.));}'});
const atmMesh=new THREE.Mesh(new THREE.SphereGeometry(R*1.055,64,64),atmMat);
scene.add(atmMesh);

let innerL=null,coastL=null;           /* 국경·해안선 — 지도 로드 후 채워진다 */
/* 지도는 두 번에 나눠 온다: 가벼운 110m으로 즉시 그리고, 첫 화면이 뜬 뒤
   정밀한 50m 경계선을 조용히 갈아끼운다. 채움 텍스처는 4096px에서 이미 한계라
   정밀본을 다시 구워도 얻는 게 없다 — 확대에서 선명해지는 것은 벡터 경계선뿐이다 */
const TOPO_FAST='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
const TOPO_FINE='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json';
fetch(TOPO_FAST).then(r=>r.json()).then(topo=>{
  const feats=topojson.feature(topo,topo.objects.countries).features;
  document.getElementById('ncty').textContent=feats.length;
  /* 채움: 등장방형 캔버스 → 텍스처 (나라별 미묘한 명도 차로 구분) */
  const c=document.createElement('canvas');c.width=4096;c.height=2048;
  const x=c.getContext('2d');
  x.fillStyle='#E2DACB';x.fillRect(0,0,4096,2048); /* 바다 — 살짝 짙은 종이 */
  const px=(lo)=> (lo+180)/360*4096, py=(la)=> (90-la)/180*2048;
  feats.forEach((f,fi)=>{
    /* 육지는 바다보다 밝다 — 종이에 찍은 지도의 결. 나라별 음영은 아주 옅게만 */
    const shade=0.965+((fi*2654435761)%1000)/1000*0.035; /* 나라별 결정적 음영 */
    const g0=Math.round(250*shade),g1=Math.round(247*shade),g2=Math.round(240*shade);
    x.fillStyle=`rgb(${g0},${g1},${g2})`;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    /* 날짜변경선 처리: 경도 언랩(±360 연속화) 후 ±폭 오프셋 3회 드로잉 —
       러시아·피지 등 ±180° 걸침 나라가 전폭 띠(극 도넛)로 새는 것을 방지.
       예외: 남극은 하단 전폭 변이 극관을 정당하게 채우므로 원본 그대로 */
    if((f.properties.name||'').toLowerCase()==='antarctica'){
      polys.forEach(poly=>{
        x.beginPath();
        poly.forEach(ring=>{ring.forEach((p,i)=>{i?x.lineTo(px(p[0]),py(p[1])):x.moveTo(px(p[0]),py(p[1]));});x.closePath();});
        x.fill('evenodd');});
      /* 데이터가 남위 ~83° 이남을 안 갖고 있어 극점에 바다색 원반이 남음 — 극관 마저 채움 */
      x.fillRect(0,py(-82.8),4096,2048-py(-82.8));
      return;}
    polys.forEach(poly=>{
      [-4096,0,4096].forEach(off=>{
        x.beginPath();
        poly.forEach(ring=>{
          let prev=null;
          ring.forEach((p,i)=>{
            let lo=p[0];
            if(prev!==null){while(lo-prev>180)lo-=360;while(lo-prev<-180)lo+=360;}
            prev=lo;
            const X=(lo+180)/360*4096+off;
            i?x.lineTo(X,py(p[1])):x.moveTo(X,py(p[1]));});
          x.closePath();});
        x.fill('evenodd');});});});
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  /* 극지 도넛 밴딩 제거: 채움 텍스처는 평탄색뿐이라 밉맵 불필요 — 끄면 위도 띠가 사라짐 */
  t.generateMipmaps=false;t.minFilter=THREE.LinearFilter;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  baseMesh.material=new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide});
  buildBorders(topo);
  /* ── 전국 라벨 자동 생성: 경제 규모 티어 (T1 대국 상시 · T2 중견 · T3 전부) ── */
  const T1=new Set(['united states of america','china','japan','germany','india',
    'united kingdom','france','brazil','russia','canada','south korea','australia',
    'mexico','saudi arabia','indonesia','italy']);
  const T2=new Set(['spain','netherlands','turkey','switzerland','poland','argentina',
    'sweden','belgium','ireland','norway','austria','israel','united arab emirates',
    'thailand','egypt','denmark','malaysia','vietnam','philippines','bangladesh',
    'south africa','nigeria','colombia','chile','finland','romania','czechia',
    'portugal','new zealand','peru','greece','iraq','qatar','kazakhstan','hungary',
    'kuwait','morocco','ukraine','iran','pakistan','algeria','ethiopia','venezuela',
    'antarctica','greenland']);
  function centroidOf(f){ /* 최대 폴리곤의 단위벡터 평균 — 경도 랩(러시아·피지) 안전 */
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    let ring=polys[0][0];
    polys.forEach(p=>{if(p[0].length>ring.length)ring=p[0];});
    const v=new THREE.Vector3();
    ring.forEach(([lo,la])=>v.add(sphV3(la,lo,1)));   /* 반드시 구 좌표로 평균 */
    v.normalize();
    const la=Math.asin(v.y)/D2R;
    const lo=Math.atan2(v.z,-v.x)/D2R-180;
    return [la,((lo+540)%360)-180];}
  feats.forEach(f=>{
    const nm=f.properties&&f.properties.name;if(!nm)return;
    const key=nm.toLowerCase();
    const tier=T1.has(key)?1:T2.has(key)?2:3;
    const c=centroidOf(f);
    addLabel(nm.toUpperCase(),c[0],c[1],tier);});
  setStageMorph(MORPH);                /* 새로 생긴 국경·라벨을 현재 뷰에 맞춘다 */
  refreshClones();
  /* 첫 화면이 뜬 뒤 정밀 경계선으로 조용히 교체 — 확대해도 해안선이 각지지 않는다 */
  fetch(TOPO_FINE).then(r=>r.json()).then(fine=>{
    buildBorders(fine);
    setStageMorph(MORPH);refreshClones();
    document.getElementById('res').textContent='50m';
  }).catch(()=>{});                    /* 실패해도 110m 경계선이 그대로 남는다 */

/* ── 벡터 경계: 내부 국경(밝게) + 해안선(은은) — 각 1드로콜 ── */
function meshToSegs(mesh,r){
  const verts0=[],verts1=[];          /* 구 좌표 · 평면 좌표를 나란히 굽는다 */
  const lines=mesh.type==='MultiLineString'?mesh.coordinates:[mesh.coordinates];
  lines.forEach(line=>{for(let i=0;i<line.length-1;i++){
    if(line[i][1]<-82.8&&line[i+1][1]<-82.8)continue; /* 남극 데이터 절단선(인공 원) 제외 */
    const a0=sphV3(line[i][1],line[i][0],r),b0=sphV3(line[i+1][1],line[i+1][0],r);
    verts0.push(a0.x,a0.y,a0.z,b0.x,b0.y,b0.z);
    /* 평면에서는 ±180° 걸침 선분이 지도를 가로지르므로 경도를 언랩해 바깥으로 흘린다
       (넘친 부분은 좌우 복제 무대가 받아준다 — 채움 텍스처와 같은 해법) */
    let loA=line[i][0],loB=line[i+1][0];
    if(loB-loA>180)loB-=360; else if(loB-loA<-180)loB+=360;
    const a1=flatV3(line[i][1],loA,r),b1=flatV3(line[i+1][1],loB,r);
    verts1.push(a1.x,a1.y,a1.z,b1.x,b1.y,b1.z);}});
  const p0=new Float32Array(verts0),p1=new Float32Array(verts1);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p0,3));   /* 구 좌표 */
  g.setAttribute('aP1',new THREE.BufferAttribute(p1,3));        /* 평면 좌표 — 셰이더가 섞는다 */
  g.userData={p0,p1};
  return g;}
function addLine(geo,mat){            /* 평면에서는 경계 밖으로 흐르므로 절두체 컬링을 끈다 */
  const l=new THREE.LineSegments(geo,mat);l.frustumCulled=false;stage.add(l);return l;}
/* 종이 지도에서는 해안선이 주인공이고 국경은 거들 뿐 — 어두운 배경일 때와 반대다 */
const O_INNER=.34,O_COAST=.58;
function buildBorders(topo){          /* 해상도가 바뀌면 통째로 다시 굽는다 */
  [innerL,coastL].forEach(l=>{if(l){stage.remove(l);l.geometry.dispose();l.material.dispose();}});
  const inner=topojson.mesh(topo,topo.objects.countries,(a,b)=>a!==b);
  innerL=addLine(meshToSegs(inner,R*1.0018),lineMat(0x6B6259,O_INNER,false));
  const coast=topojson.mesh(topo,topo.objects.countries,(a,b)=>a===b);
  coastL=addLine(meshToSegs(coast,R*1.0015),lineMat(0x1B1714,O_COAST,false));}

/* ── 라벨: 경제 티어 + 줌 게이팅 + 크기 위계 ──
   T1 대국 = 항상·큰 글씨 · T2 중견 = 줌<2.5 · T3 전국 = 줌<1.85
   T4 주요 도시 = 줌<1.95 · T5 광역 도시 = 줌<1.6 */
function labelSprite(txt,tier){
  const c=document.createElement('canvas');c.width=640;c.height=96;
  const x=c.getContext('2d');
  const size=tier===1?38:tier===2?30:tier===4?27:tier===5?22:23; /* 크기 = 위계 */
  x.font=`${tier<=2?600:500} ${size}px Archivo,'Segoe UI',sans-serif`;
  x.textAlign='center';x.textBaseline='middle';
  x.letterSpacing=tier===1?'4px':'2.5px';
  x.lineWidth=7;x.strokeStyle='rgba(250,247,240,.92)';x.strokeText(txt,320,48); /* 종이색 헤일로 */
  /* 나라 이름은 먹빛, 도시 이름은 와인빛 — 축이 다르면 색도 다르다 */
  x.fillStyle=tier===1?'rgba(27,23,20,.92)':tier===2?'rgba(27,23,20,.78)'
    :tier===4?'rgba(122,34,51,.90)':tier===5?'rgba(122,34,51,.72)':'rgba(107,98,89,.72)';
  x.fillText(txt,320,48);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,
    depthTest:false,opacity:0})); /* 구에 잘리지 않음 — 노출은 페이드가 결정 */
  s.renderOrder=20;
  const k=tier===1?.34:tier===2?.26:tier===4?.22:tier===5?.18:.20;
  s.scale.set(k,k*96/640,1);return s;}

/* ══════════════════════════════════════════════════════════════════
   여정 (§5.3) — 도장(사실)과 여정선(서사)은 다른 물건이다.

   ⚠️ 아래 좌표는 전부 도시 좌표다. 식당·등급·가이드 데이터는 이 파일에 없다 (§4, §F).
   P1에서 정본 스냅샷이 들어오면 이 배열만 갈아끼우면 된다.
   ══════════════════════════════════════════════════════════════════ */
/* with: 'solo' 나 혼자 · 'together' 함께 갔고 서로 확인됨 · 'apart' 여럿이 따로 갔음.
   함께 여부는 §5.4대로 상호 확인만이 판정한다 — 선이 겹친다고 함께 간 것이 아니다 */
const JOURNEY=[            /* [도시, 위도, 경도, 날짜, 동행상태] — 시간 순 */
  ['TOKYO',        35.68, 139.70,'2023-05','together'],
  ['PARIS',        48.86,   2.35,'2023-11','solo'],
  ['SAN SEBASTIÁN',43.32,  -1.98,'2024-04','apart'],
  ['LIMA',        -12.05, -77.04,'2024-09','solo'],
  ['NEW YORK',     40.71, -74.01,'2025-02','together'],
  ['SEOUL',        37.57, 126.98,'2025-08','solo']];
const FLOATING=[           /* 떠 있는 별 — 갔지만 언제였는지 기억이 안 나는 곳 (§5.3.3) */
  ['COPENHAGEN',   55.68,  12.57],
  ['HONG KONG',    22.30, 114.17]];
const EMPTY_SLOTS=4;       /* 아직 안 간 칸 — 빈칸이 남아 있는 게 보여야 채우고 싶어진다 */

const journeyG=new THREE.Group();stage.add(journeyG);
const jStars=[];           /* {la,lo,mesh,lift} — 모핑 때 자리를 다시 잡아야 한다 */
const jRings=[];           /* 함께 간 별에 두르는 고리 */
let jLine=null;

function greatCircle(la1,lo1,la2,lo2,steps){
  /* 두 점 사이 대권(great circle) — 지구 위 실제 최단 경로. 지도에서는 곡선으로 보인다 */
  const a=sphV3(la1,lo1,1),b=sphV3(la2,lo2,1);
  const out=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const v=a.clone().lerp(b,t).normalize();          /* 구면 보간 */
    const la=Math.asin(THREE.MathUtils.clamp(v.y,-1,1))/D2R;
    let lo=Math.atan2(v.z,-v.x)/D2R-180;
    lo=((lo+540)%360)-180;
    const lift=Math.sin(t*Math.PI)*.055;              /* 가운데가 들리는 활 모양 */
    out.push([la,lo,lift]);}
  return out;}

function buildJourney(){
  /* 여정선: 대권 궤적을 잘게 쪼개 LineSegments로. 구·평면 두 벌 좌표를 같이 굽는다 */
  const v0=[],v1=[];
  for(let s=0;s<JOURNEY.length-1;s++){
    const pts=greatCircle(JOURNEY[s][1],JOURNEY[s][2],JOURNEY[s+1][1],JOURNEY[s+1][2],48);
    let unwrap=0;                                     /* 평면용 경도 연속화 */
    for(let i=0;i<pts.length-1;i++){
      const [laA,loA,lfA]=pts[i];
      let [laB,loB,lfB]=pts[i+1];
      const a0=sphV3(laA,loA,R+lfA),b0=sphV3(laB,loB,R+lfB);
      v0.push(a0.x,a0.y,a0.z,b0.x,b0.y,b0.z);
      /* 평면: ±180°를 넘어가면 지도 밖으로 계속 흘려보낸다. 좌우 복제본이 이어받는다 */
      const loAu=loA+unwrap;
      let d=loB-loA;
      if(d>180)unwrap-=360; else if(d<-180)unwrap+=360;
      const loBu=loB+unwrap;
      const a1=flatV3(laA,loAu,R+lfA),b1=flatV3(laB,loBu,R+lfB);
      v1.push(a1.x,a1.y,a1.z,b1.x,b1.y,b1.z);}}
  const jp0=new Float32Array(v0),jp1=new Float32Array(v1);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(jp0,3));
  g.setAttribute('aP1',new THREE.BufferAttribute(jp1,3));
  g.userData={p0:jp0,p1:jp1};
  jLine=new THREE.LineSegments(g,lineMat(0x7A2233,0,true));
  jLine.frustumCulled=false;jLine.renderOrder=14;
  journeyG.add(jLine);
  /* 별: 다녀온 곳 = 켜진 별. 우리가 그린 별이지 남의 도안이 아니다 (§3.1) */
  const starGeo=new THREE.SphereGeometry(.010,12,12);
  const mkStar=(la,lo,col,lift)=>{
    const m=new THREE.Mesh(starGeo,new THREE.MeshBasicMaterial({
      color:col,transparent:true,opacity:0,depthTest:false}));
    m.renderOrder=15;
    m.position.copy(blendV3(la,lo,R+lift,MORPH));
    journeyG.add(m);
    jStars.push({la,lo,mesh:m,lift});
    return m;};
  JOURNEY.forEach(j=>mkStar(j[1],j[2],0x7A2233,.004));
  FLOATING.forEach(f=>mkStar(f[1],f[2],0x8C8175,.028)); /* 떠 있는 별 — 지면에서 살짝 띄운다 */
  /* 고리: 관계를 그래프가 아니라 지도 위에 그린다 (§5.4의 다섯 상태).
     이어진 고리 = 함께 감 · 끊긴 고리 = 여럿이 따로 감 · 고리 없음 = 나 혼자 */
  JOURNEY.forEach(j=>{
    if(j[4]==='together')buildRing(j[1],j[2],2.6,false);
    else if(j[4]==='apart')buildRing(j[1],j[2],2.6,true);});
  paintPassport();}

/* 구면 위의 작은 원 — 위경도로 걸어 그리므로 모핑을 그대로 탄다 */
function buildRing(la0,lo0,degR,dashed){
  const N=72,v0=[],v1=[],lift=.006;
  const coslat=Math.max(.12,Math.cos(la0*D2R));
  const pt=t=>{const a=t/N*Math.PI*2;
    return [la0+degR*Math.cos(a), lo0+degR*Math.sin(a)/coslat];};
  for(let i=0;i<N;i++){
    if(dashed&&i%2)continue;                      /* 끊긴 고리 */
    const [laA,loA]=pt(i),[laB,loB]=pt(i+1);
    const a0=sphV3(laA,loA,R+lift),b0=sphV3(laB,loB,R+lift);
    v0.push(a0.x,a0.y,a0.z,b0.x,b0.y,b0.z);
    const a1=flatV3(laA,loA,R+lift),b1=flatV3(laB,loB,R+lift);
    v1.push(a1.x,a1.y,a1.z,b1.x,b1.y,b1.z);}
  const p0=new Float32Array(v0),p1=new Float32Array(v1);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p0,3));
  g.setAttribute('aP1',new THREE.BufferAttribute(p1,3));
  g.userData={p0,p1};
  const l=new THREE.LineSegments(g,lineMat(0x6E7355,0,true)); /* 올리브 = 함께 */
  l.frustumCulled=false;l.renderOrder=13;
  journeyG.add(l);jRings.push(l);
  return l;}

/* 여권 한 페이지 — 도장이 하나씩 눌린다 */
function paintPassport(){
  const cells=[];
  const rot=i=>(((i*2654435761)%1000)/1000*8-4).toFixed(2)+'deg'; /* -4°~+4°, 매번 같은 각도 */
  JOURNEY.forEach((j,i)=>{
    const tg=j[4]==='together';
    cells.push(`<div class="stamp${tg?' tg':''}" style="--r:${rot(i)};animation-delay:${(i*70)}ms">`
      +`<span class="n">${j[0]}</span><span class="d">${j[3].replace('-',' · ')}</span></div>`);});
  FLOATING.forEach((f,i)=>{
    cells.push(`<div class="stamp float" style="--r:${rot(i+40)};animation-delay:${((JOURNEY.length+i)*70)}ms">`
      +`<span class="n">${f[0]}</span><span class="d">날짜 미상</span></div>`);});
  const base=JOURNEY.length+FLOATING.length;
  for(let i=0;i<EMPTY_SLOTS;i++)
    cells.push(`<div class="stamp empty" style="animation-delay:${((base+i)*70)}ms"><span class="d">빈칸</span></div>`);
  document.getElementById('jstops').innerHTML=cells.join('');}
buildJourney();

let journeyAlpha=0,jTween=null;        /* 여정 레이어의 등장·퇴장 */

/* ── 모핑: 지구본이 펼쳐지고(→평면) 접힌다(→구) ── */
function setStageMorph(k){
  MORPH=k;
  setLerpGeo(baseGeo,BP0,BP1,k);      /* 바탕 격자만 CPU — 5.6만 개라 가볍다 */
  setLineK(innerL,k);setLineK(coastL,k);setLineK(jLine,k); /* 선은 GPU가 접는다 */
  jRings.forEach(l=>setLineK(l,k));
  labelObjs.forEach(o=>o.s.position.copy(blendV3(o.la,o.lo,R*1.012,k)));
  jStars.forEach(s=>s.mesh.position.copy(blendV3(s.la,s.lo,R+s.lift,k)));
  const d3=new THREE.Object3D();
  ALLCITY.forEach((c2,i)=>{d3.position.copy(blendV3(c2[1],c2[2],R*1.0025,k));
    d3.updateMatrix();cityIM.setMatrixAt(i,d3.matrix);});
  cityIM.instanceMatrix.needsUpdate=true;}

let morphAnim=null;

/* ── 카메라: 뷰별 조작 ── */
function configCamera(){
  if(VIEW==='2d'){
    /* 왼쪽 드래그 = 끌기(팬). 회전만 꺼두면 왼쪽 버튼이 죽어 있게 된다 */
    controls.enableRotate=false;controls.enablePan=true;controls.screenSpacePanning=true;
    controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
    controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_PAN};
    controls.autoRotate=false;
    controls.minDistance=.012;controls.maxDistance=4;   /* 화면 세로 ≈ 90km — 도시 하나 크기 */
    controls.target.set(camera.position.x,camera.position.y,0);
    camera.position.z=Math.max(camera.position.z,1.2);
    camera.lookAt(controls.target);
  }else{
    controls.enableRotate=true;controls.enablePan=false;
    controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};
    controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
    controls.autoRotate=AUTOROT;
    controls.minDistance=1.008;controls.maxDistance=5.5; /* 고도 ≈ 51km (기존 2,548km의 1/50) */
    controls.target.set(0,0,0);
    if(camera.position.length()<1.5)camera.position.set(0,.5,3.8);}}

/* 가까이 갈수록 앞유리(near plane)를 좁힌다 — 안 그러면 지표가 잘려 나가고,
   반대로 항상 좁혀두면 깊이 정밀도가 떨어져 국경선이 지면과 싸운다(z-fighting) */
function updateNear(){
  const d=VIEW==='2d'?Math.abs(camera.position.z):Math.max(0,camera.position.length()-R);
  const n=THREE.MathUtils.clamp(d*.3,.0008,.05);
  if(Math.abs(camera.near-n)>n*.15){camera.near=n;camera.updateProjectionMatrix();}}

/* ── 지도도 지구본처럼 계속 흐른다 ──
   무대가 ±W2에 복제돼 있으므로 카메라 x를 W2만큼 되감으면 화면은 완전히 동일하다.
   이음매 없이 영원히 서쪽으로 흘러가는 지도가 된다 */
/* 지구본은 autoRotateSpeed .22로 한 바퀴에 약 273초가 걸린다.
   지도도 같은 속도로 느껴지도록 W2(=지구 한 바퀴)를 273초에 지나가게 맞춘다 */
const DRIFT=W2/273;
let userHold=0;                       /* 사람이 만지는 동안은 흐름을 멈춘다 */
controls.addEventListener('start',()=>{userHold=1;});
controls.addEventListener('end',()=>{userHold=performance.now();});
function driftMap(dt){
  if(VIEW!=='2d'||!AUTOROT||morphAnim)return;
  if(userHold===1)return;                                   /* 잡고 있는 중 */
  if(userHold&&performance.now()-userHold<2500)return;      /* 놓은 뒤 2.5초는 쉰다 */
  const dx=DRIFT*dt;
  camera.position.x+=dx;controls.target.x+=dx;
  if(camera.position.x>W2/2){camera.position.x-=W2;controls.target.x-=W2;} /* 되감기 */}

/* ── 뷰 전환: 3D↔지도는 접고 펴기, 여정은 같은 투영 위에 얹기 ── */
const HINT={'3d':'드래그 회전 / 휠·핀치 줌','2d':'드래그 이동 / 휠·핀치 줌',
  'journey':'다녀온 별이 순서대로 이어집니다'};
function setView(v){
  if(v===MODE||morphAnim)return;
  MODE=v;
  document.querySelectorAll('#modebar .mbtn').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.getElementById('hint').textContent=HINT[v];
  document.getElementById('jpanel').classList.toggle('on',v==='journey');
  tweenJourney(v==='journey'?1:0,520);
  const wantFlat=(v==='2d');
  if(wantFlat!==(VIEW==='2d')){startMorph(wantFlat?1:0,v);return;} /* 투영이 바뀐다 → 모핑 */
  configCamera();}                                                 /* 같은 투영 → 즉시 */
document.querySelectorAll('#modebar .mbtn').forEach(b=>
  b.addEventListener('click',()=>setView(b.dataset.v)));

window.__dbg={labelObjs,camera,jStars,setView,setStageMorph,
  getMorph:()=>MORPH,getView:()=>VIEW,getMode:()=>MODE,
  setVIEW:v=>{VIEW=v;configCamera();refreshClones();}}; /* 검증용 훅 */

/* ────────────────────────────────────────────────────────────────
   ESTELA MOUNT POINTS — the star layers are still empty, on purpose.
   P1  canon layers  : static JSON snapshots (Michelin, Blue Ribbon, ...)
                       → star points on `stage`, colour by layer, size by
                         the 3-step intensity of §3.1, one toggleable
                         THREE.Group per layer. Give every point the same
                         {la,lo} + blendV3 treatment as `jStars` so it folds
                         with the map.
   P2  camera        : country click → ease-in to city → restaurant cards.
   P3  journey line  : replace the JOURNEY / FLOATING sample arrays above
                       with the member's own visits. The rendering is done.
   Rule (§4): snapshots are static files in this repo. No live scraping,
   no runtime calls to any guide's servers. Every record carries its
   source layer and a last-verified date.
   ──────────────────────────────────────────────────────────────── */

function updateLabels(){
  const camDir=camera.position.clone().normalize();
  const dist=VIEW==='2d'?camera.position.z+1.2:camera.position.length();
  labelObjs.forEach(o=>{
    const facing=VIEW==='2d'?1:o.normal.dot(camDir); /* 1=정면 · 0=림 · 음수=뒷면 */
    const tierOn=o.tier===1||(o.tier===2&&dist<2.5)||(o.tier===3&&dist<1.85)
      ||(o.tier===4&&dist<1.95)||(o.tier===5&&dist<1.6);
    const fade=VIEW==='2d'?1:THREE.MathUtils.smoothstep(facing,.12,.35); /* 수평선 페이드 */
    o.s.material.opacity=tierOn?fade*.95:0;});}

let frames=0,fpsT=performance.now(),lastT=performance.now();
const fpsEl=document.getElementById('fps');
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  /* 모핑 진행 */
  if(morphAnim){
    const p=Math.min(1,(now-morphAnim.t0)/morphAnim.dur);
    const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;     /* ease-in-out */
    setStageMorph(morphAnim.k0+(morphAnim.k1-morphAnim.k0)*e);
    camera.position.lerpVectors(morphAnim.camFrom,morphAnim.camTo,e);
    camera.lookAt(0,0,0);
    if(p>=1){
      VIEW=morphAnim.k1===1?'2d':'3d';
      morphAnim=null;controls.enabled=true;
      configCamera();refreshClones();}}
  /* 여정 레이어 페이드 + 지도 물러남 */
  if(jTween){
    const p=Math.min(1,(now-jTween.t0)/jTween.dur);
    journeyAlpha=jTween.from+(jTween.to-jTween.from)*p;
    if(p>=1)jTween=null;}
  setLineO(jLine,journeyAlpha*.90);
  jRings.forEach(l=>setLineO(l,journeyAlpha*.85));
  jStars.forEach(s=>{s.mesh.material.opacity=journeyAlpha;});
  const dim=1-journeyAlpha*.55;                       /* 여정에서는 지도가 한 발 물러선다 */
  setLineO(innerL,O_INNER*dim);setLineO(coastL,O_COAST*dim);
  cityIM.material.opacity=O_CITY*dim;
  atmMat.uniforms.a.value=(1-MORPH)*dim;
  atmMesh.visible=MORPH<.99;

  if(controls.enabled){driftMap(dt);controls.update();}
  updateNear();
  updateLabels();
  renderer.render(scene,camera);
  frames++;if(now-fpsT>1000){fpsEl.textContent=frames;frames=0;fpsT=now;}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
