<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ESTELA — globe foundation. Map-only 3D globe (country fills + vector borders +
     tiered labels for countries/cities). Forked from after-flight/index.html,
     which was seeded from batavia-wtl labs/globe-base.html v4
     (dateline unwrap + polar cap fixes included).
     Canon-guide star layers (§3) and the journey line (§5.3) mount on top of this base.
     Rendering engine: three.js r160 + topojson-client, both via CDN.

     v0.2 — three view modes (GLOBE / MAP / JOURNEY), ported from
     batavia-wtl site/index.html. The morph works because the base is NOT a sphere:
     it is one PlaneGeometry grid whose every vertex is lerped between a wrapped
     (spherical) and an unfolded (flat) position. Borders, labels, city dots and the
     journey trail all carry the same p0/p1 pair, so the whole stage folds as one.
     The JOURNEY sample trail uses CITY coordinates only — no guide data of any kind
     is present in this file (§4, §F). -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estela — Globe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500&family=Archivo:wght@400;500;600&display=swap">
<style>
  /* ── Direction C + olive. Wine is me, olive is together, ink is the map. ── */
  :root{
    --paper:#F2EEE6; --card:#FFFFFF; --sand:#E4DED2;
    --ink:#1B1714;   --dim:#6B6259;  --mute:#8C8175;
    --rule:rgba(27,23,20,.13);
    --wine:#7A2233;  --olive:#6E7355;
    --serif:Newsreader,Georgia,serif; --sans:Archivo,'Helvetica Neue',sans-serif;
  }
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    overflow:hidden;height:100vh;height:100dvh}
  #hud{position:fixed;top:10px;left:12px;z-index:5;font:11px/1.7 var(--sans);color:var(--dim);
    background:rgba(255,255,255,.72);border:1px solid var(--rule);padding:7px 12px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #hud b{color:var(--ink);font-weight:600}
  #hud .wm{font-family:var(--serif);font-size:14px;letter-spacing:3.4px;color:var(--ink)}
  #note{position:fixed;bottom:10px;left:12px;right:12px;z-index:5;font:10px var(--sans);color:var(--dim)}
  /* ── 뷰 전환 바 ── */
  #modebar{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);z-index:6;display:flex;
    background:rgba(255,255,255,.82);border:1px solid rgba(27,23,20,.20);
    padding:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .mbtn{font:500 11.5px/1 var(--sans);letter-spacing:2px;color:var(--dim);
    padding:11px 20px;cursor:pointer;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;transition:color .3s,background .3s}
  .mbtn+.mbtn{border-left:1px solid var(--rule)}
  .mbtn.on{color:var(--paper);background:var(--ink);font-weight:600}
  /* ── 여정 = 여권 한 페이지 ── */
  #jpanel{position:fixed;top:12px;right:12px;z-index:6;width:286px;max-height:calc(100vh - 24px);overflow-y:auto;
    background:var(--card);border:1px solid var(--rule);padding:15px 16px 13px;
    font:11px/1.55 var(--sans);color:var(--dim);
    box-shadow:0 10px 30px rgba(27,23,20,.10);
    opacity:0;transform:translateY(-6px);pointer-events:none;
    transition:opacity .45s ease,transform .45s ease}
  #jpanel.on{opacity:1;transform:none;pointer-events:auto}
  #jpanel h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:5px;color:var(--ink)}
  #jpanel .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  #jpanel .tag{font-size:8.5px;letter-spacing:1.6px;font-weight:600;color:var(--card);
    background:var(--mute);padding:3px 8px}
  /* 도장판 */
  #jstops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stamp{aspect-ratio:1;border:1.5px solid var(--wine);color:var(--wine);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    text-align:center;transform:rotate(var(--r));transform-origin:50% 50%}
  .stamp .n{font-family:var(--serif);font-size:11.5px;font-weight:500;line-height:1.12;padding:0 2px;
    overflow-wrap:anywhere}   /* COPENHAGEN·SAN SEBASTIÁN 같은 긴 이름도 칸 안에서 접힌다 */
  .stamp .d{font-size:8px;letter-spacing:.6px;opacity:.82}
  /* 함께 간 도장에는 올리브 겹도장이 하나 더 찍힌다 */
  .stamp.tg{border-color:var(--olive);color:var(--olive);box-shadow:2.5px 2.5px 0 rgba(110,115,85,.22)}
  /* 두 번 이상 찍힌 칸 — 살짝 어깼난 겹도장 자국이 남는다 */
  .stamp.again{box-shadow:3px -3px 0 rgba(122,34,51,.20)}
  .stamp.again.tg{box-shadow:3px -3px 0 rgba(110,115,85,.20),2.5px 2.5px 0 rgba(110,115,85,.22)}
  .stamp{position:relative}
  .stamp .x{position:absolute;top:2px;right:3px;font-size:8px;font-weight:600;opacity:.85}
  .stamp.empty{border:1.5px dashed rgba(140,129,117,.65);color:var(--dim);transform:none}
  .stamp.float{border-style:dashed;border-color:rgba(140,129,117,.8);color:var(--dim)}
  /* 찍히는 순간 — 위에서 내려와 눌린다 */
  #jpanel.on .stamp{animation:press .5s cubic-bezier(.16,1.02,.3,1) backwards}
  @keyframes press{
    0%  {opacity:0;transform:rotate(var(--r)) scale(2.1)}
    55% {opacity:1;transform:rotate(var(--r)) scale(.94)}
    75% {transform:rotate(var(--r)) scale(1.03)}
    100%{opacity:1;transform:rotate(var(--r)) scale(1)}}
  @media (prefers-reduced-motion:reduce){#jpanel.on .stamp{animation:none}}
  #jpanel .foot{color:var(--dim);font-size:9.5px;margin-top:11px;padding-top:9px;
    border-top:1px solid var(--rule);line-height:1.6}
  #jpanel .key{display:flex;gap:10px;margin-top:7px;font-size:9.5px;color:var(--dim)}
  #jpanel .key i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
  #jpanel .sw{width:9px;height:9px;border:1.5px solid var(--wine);display:inline-block}
  #jpanel .sw.o{border-color:var(--olive)}
  #jpanel .sw.g{border-style:dashed;border-color:rgba(140,129,117,.7)}
  /* ── 레이어 패널 ── */
  #layers{position:fixed;bottom:34px;left:12px;z-index:6;background:rgba(255,255,255,.86);
    border:1px solid var(--rule);padding:10px 12px;font:11px/1.5 var(--sans);color:var(--dim);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:230px}
  #layers h4{margin:0 0 7px;font-size:9px;letter-spacing:2.2px;color:var(--mute);font-weight:600}
  .lrow{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    -webkit-user-select:none;-webkit-tap-highlight-color:transparent;padding:3px 0}
  .lrow .dot{width:10px;height:10px;border-radius:999px;background:var(--wine);flex-shrink:0}
  .lrow.off .dot{background:transparent;border:1.5px solid rgba(140,129,117,.7)}
  .lrow.off .nm{color:var(--mute)}
  .lrow .nm{color:var(--ink);font-weight:500;flex-grow:1}
  .lrow .ct{color:var(--dim);font-variant-numeric:tabular-nums}
  #layers .prov{margin-top:7px;padding-top:7px;border-top:1px solid var(--rule);
    font-size:9.5px;color:var(--dim);line-height:1.55}
  @media (max-width:560px){#layers{display:none}}
  /* ══ 여정 화면 — 전체를 차지한다. 지구본은 뒤에서 계속 돈다 ══ */
  #jview{position:fixed;inset:0;z-index:7;overflow:auto;
    background:linear-gradient(180deg,rgba(242,238,230,.90),rgba(242,238,230,.97) 22%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    visibility:hidden;opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
  #jview.on{visibility:visible;opacity:1;transform:none;pointer-events:auto;
    transition:opacity .45s ease,transform .45s ease}
  #jwrap{max-width:1180px;margin:0 auto;padding:34px 22px 110px}
  #jhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:22px}
  #jhead .ttl{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:12px;color:var(--ink)}
  #jsum{display:flex;gap:22px;flex-wrap:wrap}
  #jsum .st{display:flex;flex-direction:column;font-size:10px;letter-spacing:1.4px;color:var(--dim)}
  #jsum .st b{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:0;color:var(--ink)}
  #jstage{display:grid;grid-template-columns:minmax(320px,1.45fr) minmax(220px,1fr) minmax(220px,1fr);
    gap:26px 30px;align-items:start}
  .jcol{min-width:0}
  .colh{font-size:9px;letter-spacing:2.4px;font-weight:600;color:var(--mute);
    text-transform:uppercase;margin-bottom:10px}
  .colh.mt{margin-top:20px}
  #jsample{font-size:10px;color:var(--dim);margin-top:10px;line-height:1.6}
  /* 진행률 */
  .prow{margin-bottom:13px}
  .prow .pl{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;
    color:var(--dim);margin-bottom:5px}
  .prow .pl b{color:var(--ink);font-variant-numeric:tabular-nums}
  .prow .bar{height:6px;background:var(--sand)}
  .prow .bar i{display:block;height:6px}
  .hint{font-size:9.5px;color:var(--dim);line-height:1.65;margin-top:10px}
  /* 함께 */
  .brow{display:flex;gap:11px;align-items:center;padding:6px 0}
  .brow b{display:block;font-size:12px;color:var(--ink);font-weight:600}
  .brow span{font-size:10.5px;color:var(--dim)}
  .wrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink);padding:3px 0}
  .wrow .wd{width:8px;height:8px;border-radius:999px;flex-shrink:0}
  .wrow i{margin-left:auto;font-style:normal;font-size:10px;color:var(--dim)}
  /* ══ 고른 곳 카드 ══ */
  #card{position:fixed;right:12px;bottom:88px;z-index:9;width:288px;
    background:var(--card);border:1px solid var(--rule);padding:16px 17px 14px;
    box-shadow:0 12px 34px rgba(27,23,20,.14);
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .3s ease,transform .3s ease}
  #card.on{opacity:1;transform:none;pointer-events:auto}
  #card h3{margin:2px 0 3px;font-family:var(--serif);font-size:23px;font-weight:400;
    line-height:1.15;color:var(--ink)}
  #card .src{font-size:8.5px;letter-spacing:2px;font-weight:600;color:var(--wine);text-transform:uppercase}
  #card .sub{font-size:11.5px;color:var(--dim);margin-bottom:11px}
  #card .mystamps{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
  #card .mystamps span{font-size:9px;letter-spacing:.6px;color:var(--wine);
    border:1px solid var(--wine);padding:2px 6px}
  #card .acts{display:flex;flex-direction:column;gap:7px}
  #card button{font:500 12px var(--sans);padding:11px 0;cursor:pointer;
    border:1px solid rgba(27,23,20,.22);background:transparent;color:var(--ink);
    -webkit-tap-highlight-color:transparent}
  #card button.primary{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:600}
  #card button.on{border-color:var(--olive);color:var(--olive)}
  #card button.quiet{border:0;color:var(--dim);font-size:10.5px;padding:4px 0}
  #card #cx{position:absolute;top:6px;right:8px;border:0;background:0;font-size:17px;
    color:var(--mute);padding:2px 6px;line-height:1}
  #card .prov{font-size:9px;color:var(--dim);line-height:1.55;margin-top:11px;
    padding-top:9px;border-top:1px solid var(--rule)}
  @media (max-width:900px){
    #jstage{grid-template-columns:1fr}
    #jhead .ttl{font-size:30px;letter-spacing:8px}
    #jwrap{padding:22px 14px 110px}
    #card{left:12px;right:12px;width:auto;bottom:84px}
  }
  @media (max-width:560px){
    #jpanel{width:auto;left:12px;right:12px;top:auto;bottom:86px;transform:translateY(6px)}
    #jpanel.on{transform:none}
    #jstops{grid-template-columns:repeat(4,minmax(0,1fr))}
    #hud{font-size:10px;padding:6px 10px}
    .mbtn{padding:12px 16px}
  }
</style>
</head>
<body>
<div id="hud"><span class="wm">ESTELA</span> — 미식 별 레이어는 이 위에 얹습니다<br>
FPS <b id="fps">—</b> · 국가 <b id="ncty">—</b> · 경계 <b id="res">110m</b> · 별 <b id="nstar">—</b> · 단위 <b id="lvl">—</b> · 내 기록 <b id="mine">0</b> · <span id="hint">드래그 회전 / 휠·핀치 줌</span></div>

<div id="modebar">
  <span class="mbtn on" data-v="3d">3D</span>
  <span class="mbtn" data-v="2d">지도</span>
  <span class="mbtn" data-v="journey">여정</span>
</div>

<div id="jview">
  <div id="jwrap">
    <div id="jhead">
      <div class="ttl">여정</div>
      <div id="jsum"></div>
    </div>
    <div id="jstage">
      <section class="jcol">
        <div class="colh">여권</div>
        <div id="jstops"></div>
        <div id="jsample">아직 도장이 없어 <b>샘플</b>이 서 있습니다. 지구본에서 별을 눌러
          첫 도장을 찍으면 이 자리는 선장님 기록으로 바뀝니다.</div>
      </section>

</div>

<div id="card"></div>

<div id="layers"><h4>레이어</h4><div id="lrows"></div><div class="prov" id="lprov"></div></div>

<div id="note">estela — P0 시작 베이스 (after-flight에서 분기 · 원류 batavia globe-base v4) · 여정은 샘플 도시 좌표이며 가이드 데이터 없음</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"topojson-client":"https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as topojson from 'topojson-client';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);
camera.position.set(0,0.5,2.9);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(1.75,devicePixelRatio));
renderer.setClearColor(0xF2EEE6);        /* 종이 */
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=1.4;controls.maxDistance=5.5;controls.enablePan=false;
const AUTOROT=!matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotate=AUTOROT;
controls.autoRotateSpeed=.22;

/* ══ 투영: '3d' 구 | '2d' 평면 — 같은 정점이 감기고 펼쳐진다 (모핑의 심장) ══ */
const R=1;
const D2R=Math.PI/180;
const W2=4,H2=2;                       /* 펼친 지도의 폭·높이 */
let VIEW='3d',MODE='3d',MORPH=0;       /* MORPH 0=구 · 1=평면 */
function sphV3(la,lo,r){const phi=(90-la)*D2R,th=(lo+180)*D2R;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(th));}
function flatV3(la,lo,r){return new THREE.Vector3(lo/180*(W2/2),la/90*(H2/2),(r-R)*2.2);}
function blendV3(la,lo,r,k){return sphV3(la,lo,r).lerp(flatV3(la,lo,r),k);}
function toV3(la,lo,r){return blendV3(la,lo,r,MORPH);}
function setLerpGeo(geo,p0,p1,k){      /* 정점 배열 두 벌 사이를 선형 보간 (CPU) */
  const a=geo.attributes.position.array;
  for(let i=0;i<a.length;i++)a[i]=p0[i]+(p1[i]-p0[i])*k;
  geo.attributes.position.needsUpdate=true;
  geo.computeBoundingSphere();}
/* 선(국경·해안선·여정선)은 정점이 15만 개라 CPU로 접으면 폰에서 버벅인다.
   두 자리를 attribute 두 벌로 넘겨두고 그래픽카드가 직접 섞게 한다 — CPU 비용 0 */
function lineMat(color,opacity,onTop){
  return new THREE.ShaderMaterial({
    transparent:true,depthTest:!onTop,depthWrite:false,
    uniforms:{uC:{value:new THREE.Color(color)},uO:{value:opacity},uK:{value:MORPH}},
    vertexShader:'attribute vec3 aP1;uniform float uK;void main(){'+
      'vec3 p=mix(position,aP1,uK);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}',
    fragmentShader:'uniform vec3 uC;uniform float uO;void main(){gl_FragColor=vec4(uC,uO);}'});}
function setLineK(l,k){if(l)l.material.uniforms.uK.value=k;}
function setLineO(l,o){if(l)l.material.uniforms.uO.value=o;}

/* 배경 별은 뺐다 — 바탕이 종이가 된 이상 하늘의 별은 식당 별과 헷갈릴 뿐이다.
   이 화면에서 별은 오직 다녀온 식당을 뜻한다 */

/* ── 무대: 지도에 붙는 모든 것이 여기 담긴다 (통째로 접히고 펼쳐진다) ── */
const stage=new THREE.Group();scene.add(stage);
let stageClones=[];
function refreshClones(){ /* 지도 모드: 좌우 복제 — 끝이 없는 지도 */
  stageClones.forEach(c=>scene.remove(c));
  stageClones=[];
  if(VIEW!=='2d')return;
  [-W2,W2].forEach(off=>{
    const c=stage.clone(true);         /* 재질·기하는 공유되므로 페이드가 함께 먹는다 */
    c.position.x=off;scene.add(c);stageClones.push(c);});}

/* ── 바탕: 구가 아니라 격자다. 같은 정점이 구로 감기고 평면으로 펼쳐진다 ── */
const baseMat=new THREE.MeshBasicMaterial({color:0xE2DACB,side:THREE.DoubleSide});
const baseGeo=new THREE.PlaneGeometry(W2,H2,192,96);
const BP0=new Float32Array(baseGeo.attributes.position.count*3);
const BP1=new Float32Array(baseGeo.attributes.position.count*3);
{const pos=baseGeo.attributes.position;
 for(let i=0;i<pos.count;i++){
   const x=pos.getX(i),y=pos.getY(i);
   const lo=x/(W2/2)*180,la=y/(H2/2)*90;
   const s=sphV3(la,lo,R);
   BP0[i*3]=s.x;BP0[i*3+1]=s.y;BP0[i*3+2]=s.z;
   BP1[i*3]=x;BP1[i*3+1]=y;BP1[i*3+2]=0;}}
const baseMesh=new THREE.Mesh(baseGeo,baseMat);
setLerpGeo(baseGeo,BP0,BP1,0);
stage.add(baseMesh);

/* 종이 위에서는 파란 대기광이 어색하다. 대신 구 바깥으로 옅은 그림자를 깔아
   지구본이 종이에서 살짝 떠 보이게 한다 — 3D 전용이라 펼쳐지면 알파로 물러난다 */
const atmMat=new THREE.ShaderMaterial({
  transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.NormalBlending,
  uniforms:{c:{value:new THREE.Color(0x6B6259)},a:{value:1}},
  vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 c;uniform float a;varying vec3 vN;void main(){'+
    'float d=dot(vN,vec3(0.,0.,1.));float i=pow(clamp(.62-d,0.,1.),2.2)*smoothstep(0.,.30,-d);'+
    'gl_FragColor=vec4(c,clamp(i*.34*a,0.,1.));}'});
const atmMesh=new THREE.Mesh(new THREE.SphereGeometry(R*1.055,64,64),atmMat);

let innerL=null,coastL=null;           /* 국경·해안선 — 지도 로드 후 채워진다 */
/* 지도는 두 번에 나눠 온다: 가벼운 110m으로 즉시 그리고, 첫 화면이 뜬 뒤
   정밀한 50m 경계선을 조용히 갈아끼운다. 채움 텍스처는 4096px에서 이미 한계라
   정밀본을 다시 구워도 얻는 게 없다 — 확대에서 선명해지는 것은 벡터 경계선뿐이다 */
const TOPO_FAST='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
const TOPO_FINE='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json';
fetch(TOPO_FAST).then(r=>r.json()).then(topo=>{
  const feats=topojson.feature(topo,topo.objects.countries).features;
  document.getElementById('ncty').textContent=feats.length;
  /* 채움: 등장방형 캔버스 → 텍스처 (나라별 미묘한 명도 차로 구분) */
  const c=document.createElement('canvas');c.width=4096;c.height=2048;
  const x=c.getContext('2d');
  x.fillStyle='#E2DACB';x.fillRect(0,0,4096,2048); /* 바다 — 살짝 짙은 종이 */
  const px=(lo)=> (lo+180)/360*4096, py=(la)=> (90-la)/180*2048;
  feats.forEach((f,fi)=>{
    /* 육지는 바다보다 밝다 — 종이에 찍은 지도의 결. 나라별 음영은 아주 옅게만 */
    const shade=0.965+((fi*2654435761)%1000)/1000*0.035; /* 나라별 결정적 음영 */
    const g0=Math.round(250*shade),g1=Math.round(247*shade),g2=Math.round(240*shade);
    x.fillStyle=`rgb(${g0},${g1},${g2})`;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    /* 날짜변경선 처리: 경도 언랩(±360 연속화) 후 ±폭 오프셋 3회 드로잉 —
       러시아·피지 등 ±180° 걸침 나라가 전폭 띠(극 도넛)로 새는 것을 방지.
       예외: 남극은 하단 전폭 변이 극관을 정당하게 채우므로 원본 그대로 */
    if((f.properties.name||'').toLowerCase()==='antarctica'){
      polys.forEach(poly=>{
        x.beginPath();
        poly.forEach(ring=>{ring.forEach((p,i)=>{i?x.lineTo(px(p[0]),py(p[1])):x.moveTo(px(p[0]),py(p[1]));});x.closePath();});
        x.fill('evenodd');});
      /* 데이터가 남위 ~83° 이남을 안 갖고 있어 극점에 바다색 원반이 남음 — 극관 마저 채움 */
      x.fillRect(0,py(-82.8),4096,2048-py(-82.8));
      return;}
    polys.forEach(poly=>{
      [-4096,0,4096].forEach(off=>{
        x.beginPath();
        poly.forEach(ring=>{
          let prev=null;
          ring.forEach((p,i)=>{
            let lo=p[0];
            if(prev!==null){while(lo-prev>180)lo-=360;while(lo-prev<-180)lo+=360;}
            prev=lo;
            const X=(lo+180)/360*4096+off;
            i?x.lineTo(X,py(p[1])):x.moveTo(X,py(p[1]));});
          x.closePath();});
        x.fill('evenodd');});});});
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  /* 극지 도넛 밴딩 제거: 채움 텍스처는 평탄색뿐이라 밉맵 불필요 — 끄면 위도 띠가 사라짐 */
  t.generateMipmaps=false;t.minFilter=THREE.LinearFilter;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  baseMesh.material=new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide});
  buildBorders(topo);
  /* ── 전국 라벨 자동 생성: 경제 규모 티어 (T1 대국 상시 · T2 중견 · T3 전부) ── */
  const T1=new Set(['united states of america','china','japan','germany','india',
    'united kingdom','france','brazil','russia','canada','south korea','australia',
    'mexico','saudi arabia','indonesia','italy']);
  const T2=new Set(['spain','netherlands','turkey','switzerland','poland','argentina',
    'sweden','belgium','ireland','norway','austria','israel','united arab emirates',
    'thailand','egypt','denmark','malaysia','vietnam','philippines','bangladesh',
    'south africa','nigeria','colombia','chile','finland','romania','czechia',
    'portugal','new zealand','peru','greece','iraq','qatar','kazakhstan','hungary',
    'kuwait','morocco','ukraine','iran','pakistan','algeria','ethiopia','venezuela',
    'antarctica','greenland']);
  function centroidOf(f){ /* 최대 폴리곤의 단위벡터 평균 — 경도 랩(러시아·피지) 안전 */
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    let ring=polys[0][0];
    polys.forEach(p=>{if(p[0].length>ring.length)ring=p[0];});
    const v=new THREE.Vector3();
    ring.forEach(([lo,la])=>v.add(sphV3(la,lo,1)));   /* 반드시 구 좌표로 평균 */
    v.normalize();
    const la=Math.asin(v.y)/D2R;
    const lo=Math.atan2(v.z,-v.x)/D2R-180;
    return [la,((lo+540)%360)-180];}
  feats.forEach(f=>{
    const nm=f.properties&&f.properties.name;if(!nm)return;
    const key=nm.toLowerCase();
    const tier=T1.has(key)?1:T2.has(key)?2:3;
    const c=centroidOf(f);
    CENTROID.set(key,c);                /* 레이어 덩어리를 앉힐 자리 */
    addLabel(nm.toUpperCase(),c[0],c[1],tier,key);});
  loadLayers();                         /* 국경이 준비된 다음에 별을 얹는다 */
  setStageMorph(MORPH);                /* 새로 생긴 국경·라벨을 현재 뷰에 맞춘다 */
  refreshClones();
  /* 첫 화면이 뜬 뒤 정밀 경계선으로 조용히 교체 — 확대해도 해안선이 각지지 않는다 */
  fetch(TOPO_FINE).then(r=>r.json()).then(fine=>{
    buildBorders(fine);
    setStageMorph(MORPH);refreshClones();
    document.getElementById('res').textContent='50m';
  }).catch(()=>{});                    /* 실패해도 110m 경계선이 그대로 남는다 */
}).catch(e=>{document.getElementById('ncty').textContent='로드 실패';});

/* ── 벡터 경계: 내부 국경(밝게) + 해안선(은은) — 각 1드로콜 ── */
function meshToSegs(mesh,r){
  const verts0=[],verts1=[];          /* 구 좌표 · 평면 좌표를 나란히 굽는다 */
  const lines=mesh.type==='MultiLineString'?mesh.coordinates:[mesh.coordinates];
  lines.forEach(line=>{for(let i=0;i<line.length-1;i++){
    if(line[i][1]<-82.8&&line[i+1][1]<-82.8)continue; /* 남극 데이터 절단선(인공 원) 제외 */
    const a0=sphV3(line[i][1],line[i][0],r),b0=sphV3(line[i+1][1],line[i+1][0],r);
    verts0.push(a0.x,a0.y,a0.z,b0.x,b0.y,b0.z);
    /* 평면에서는 ±180° 걸침 선분이 지도를 가로지르므로 경도를 언랩해 바깥으로 흘린다
       (넘친 부분은 좌우 복제 무대가 받아준다 — 채움 텍스처와 같은 해법) */
    let loA=line[i][0],loB=line[i+1][0];
    if(loB-loA>180)loB-=360; else if(loB-loA<-180)loB+=360;
    const a1=flatV3(line[i][1],loA,r),b1=flatV3(line[i+1][1],loB,r);
    verts1.push(a1.x,a1.y,a1.z,b1.x,b1.y,b1.z);}});
  const p0=new Float32Array(verts0),p1=new Float32Array(verts1);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p0,3));   /* 구 좌표 */
  g.setAttribute('aP1',new THREE.BufferAttribute(p1,3));        /* 평면 좌표 — 셰이더가 섞는다 */
  g.userData={p0,p1};
  return g;}
function addLine(geo,mat){            /* 평면에서는 경계 밖으로 흐르므로 절두체 컬링을 끈다 */
  const l=new THREE.LineSegments(geo,mat);l.frustumCulled=false;stage.add(l);return l;}
/* 종이 지도에서는 해안선이 주인공이고 국경은 거들 뿐 — 어두운 배경일 때와 반대다 */
const O_INNER=.34,O_COAST=.58;
function buildBorders(topo){          /* 해상도가 바뀌면 통째로 다시 굽는다 */
  [innerL,coastL].forEach(l=>{if(l){stage.remove(l);l.geometry.dispose();l.material.dispose();}});
  const inner=topojson.mesh(topo,topo.objects.countries,(a,b)=>a!==b);
  innerL=addLine(meshToSegs(inner,R*1.0018),lineMat(0x6B6259,O_INNER,false));
  const coast=topojson.mesh(topo,topo.objects.countries,(a,b)=>a===b);
  coastL=addLine(meshToSegs(coast,R*1.0015),lineMat(0x1B1714,O_COAST,false));}

/* ── 라벨: 경제 티어 + 줌 게이팅 + 크기 위계 ──

function labelSprite(txt,tier){
  const c=document.createElement('canvas');c.width=640;c.height=96;
  const x=c.getContext('2d');
  /* 나라 이름은 전부 같은 크기다. 크기로 서열을 매기면 '독일이 덴마크보다 미식에서 크다'는
     거짓말이 되고, 별 개수 뱃지와 두 개의 위계가 충돌한다. 도시만 한 단계 작다 — 종류가 다른 것 */
  const isCity=tier===4||tier===5;
  const size=isCity?(tier===4?27:22):27;
  x.font=`500 ${size}px Archivo,'Segoe UI',sans-serif`;
  x.textAlign='center';x.textBaseline='middle';
  x.letterSpacing='2.5px';
  x.lineWidth=7;x.strokeStyle='rgba(250,247,240,.92)';x.strokeText(txt,320,48); /* 종이색 헤일로 */
  /* 나라 이름은 먹빛, 도시 이름은 와인빛 — 축이 다르면 색도 다르다 */
  x.fillStyle=tier===4?'rgba(122,34,51,.90)':tier===5?'rgba(122,34,51,.72)'
    :'rgba(27,23,20,.86)';   /* 나라는 먹빛 하나, 도시는 와인빛 */
  x.fillText(txt,320,48);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,
    depthTest:false,opacity:0})); /* 구에 잘리지 않음 — 노출은 페이드가 결정 */
  s.renderOrder=20;
  const k=tier===4?.22:tier===5?.18:.235;
  s.scale.set(k,k*96/640,1);return s;}

/* ══════════════════════════════════════════════════════════════════
   정본 레이어 (§3) — 정적 JSON 스냅샷을 읽어 지구본에 얹는 장치.
   가이드 서버에 실시간으로 접속하지 않는다. 파일만 갈아끼우면 된다.

   · 점 하나의 크기는 언제나 같다. 크기로 개수를 말하지 않는다 —

   · 색은 레이어가 정한다 (§3.1 — 색은 레이어, 세기는 등급).
   ══════════════════════════════════════════════════════════════════ */
const LAYER_FILES=['data/michelin-3star.json','data/unesco-gastronomy.json'];
const CENTROID=new Map();               /* 나라 이름(소문자) → [위도, 경도] */
const layerG=new THREE.Group();scene.add(layerG); /* 무대 밖 — 좌우 복제본에 끌려가지 않게 */
const layerGroups=[];
const PT_LIFT=R*1.016;
const DOT_K=.026,BUB_K=.062;            /* 점·묶음의 화면 크기 — 개수와 무관하게 고정 */

function dotTexture(rgb,kind){          /* 점 하나: 어느 레이어든 같은 크기 */
  const S=64,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d');
  const solid=kind!=='saved';
  x.beginPath();x.arc(S/2,S/2,S*.30,0,Math.PI*2);
  if(solid){x.fillStyle='rgb('+rgb+')';x.fill();}
  x.lineWidth=S*.075;x.strokeStyle='rgba(247,244,238,.92)';x.stroke();
  if(kind==='stamped'){        /* 찍힌 곳 — 바깥에 고리를 두른다 */
    x.beginPath();x.arc(S/2,S/2,S*.44,0,Math.PI*2);
    x.lineWidth=S*.075;x.strokeStyle='rgb('+rgb+')';x.stroke();}
  if(kind==='saved'){          /* 가고 싶은 곳 — 속이 비고 테두리만 */
    x.beginPath();x.arc(S/2,S/2,S*.30,0,Math.PI*2);
    x.lineWidth=S*.10;x.strokeStyle='rgb('+rgb+')';x.stroke();}
  if(kind==='sel'){            /* 고른 곳 — 먹빛 테 */
    x.beginPath();x.arc(S/2,S/2,S*.44,0,Math.PI*2);
    x.lineWidth=S*.085;x.strokeStyle='#1B1714';x.stroke();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}

const bubbleCache=new Map();
function bubbleTexture(n,rgb,done){     /* 묶음 표식: 개수가 몇이든 크기가 같다 */
  done=done||0;
  const key=n+'|'+done+'|'+rgb;if(bubbleCache.has(key))return bubbleCache.get(key);
  const S=128,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d'),cx=S/2;
  x.beginPath();x.arc(cx,cx,S*.44,0,Math.PI*2);x.fillStyle='rgba('+rgb+',.15)';x.fill();
  /* 이 무리에서 몇 곳을 찍었는지 — 테두리를 채워 나가는 눈금 */
  if(done>0){
    x.beginPath();x.arc(cx,cx,S*.415,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,done/n));
    x.lineWidth=S*.055;x.strokeStyle='#1B1714';x.lineCap='butt';x.stroke();}
  x.beginPath();x.arc(cx,cx,S*.335,0,Math.PI*2);x.fillStyle='rgb('+rgb+')';x.fill();
  x.lineWidth=S*.035;x.strokeStyle='rgba(247,244,238,.92)';x.stroke();
  const txt=n>999?'999+':String(n);
  x.font='600 '+(txt.length>=3?36:txt.length===2?44:48)+"px Archivo,'Segoe UI',sans-serif";
  x.textAlign='center';x.textBaseline='middle';x.fillStyle='#F7F4EE';
  x.fillText(txt,cx,cx+1);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  bubbleCache.set(key,t);return t;}

function hexToRgb(h){h=h.replace('#','');
  return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',');}

function addLayer(def){
  const rgb=hexToRgb(def.color||'#7A2233');
  const g=new THREE.Group();layerG.add(g);
  const mk=k=>new THREE.SpriteMaterial({map:dotTexture(rgb,k),transparent:true,depthTest:false,opacity:0});
  const matPlain=mk(),matStamped=mk('stamped'),matSaved=mk('saved'),matSel=mk('sel');
  const pts=(def.items||[]).filter(it=>isFinite(it.la)&&isFinite(it.lo)).map(it=>{
    const s=new THREE.Sprite(matPlain);
    s.renderOrder=22;s.scale.set(DOT_K,DOT_K,1);
    s.position.copy(blendV3(it.la,it.lo,PT_LIFT,MORPH));
    g.add(s);
    return {la:it.la,lo:it.lo,it,s,normal:sphV3(it.la,it.lo,1),sx:0,sy:0};});
  /* 묶음 표식은 미리 만들어 돌려 쓴다 — 매 프레임 새로 만들면 폰이 죽는다 */
  const bubbles=[];
  const need=Math.min(80,Math.ceil(pts.length/2)+6);
  for(let i=0;i<need;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,depthTest:false,opacity:0}));
    s.renderOrder=25;s.scale.set(BUB_K,BUB_K,1);s.visible=false;g.add(s);bubbles.push(s);}
  const L={def,g,rgb,pts,bubbles,matPlain,matStamped,matSaved,matSel,
           on:true,mapped:pts.length,total:def.total||pts.length};
  layerGroups.push(L);return L;}

/* ── 묶기 ──
   회전해도 숫자가 흔들리면 안 된다. 화면 격자로 묶으면 점이 1px만 움직여도
   칸이 바뀌고, 지구 뒷면으로 넘어간 점이 셈에서 빠지면서 숫자가 계속 요동친다.
   그래서 두 가지를 바꿨다.
   ① 묶음은 화면이 아니라 **위경도**로 짓는다 — 지구가 돌아도 무리가 그대로다.
   ② 묶음 칸 크기는 **계단**으로만 바뀐다 — 줌을 부드럽게 넣어도 단계를 넘을 때만 재편된다.
   ③ 숫자는 '지금 보이는 개수'가 아니라 '그 지역에 있는 개수'다. 뒷면으로 넘어가도 안 변한다.
   계단이 곧 나라 → 도시 → 지역 → 좌표의 드릴다운 단계이기도 하다. */
const LADDER=[
  {deg:40,  name:'대륙'},
  {deg:16,  name:'권역'},
  {deg:6,   name:'나라'},
  {deg:2,   name:'지방'},
  {deg:.7,  name:'도시'},
  {deg:.25, name:'지역'},
  {deg:.08, name:'동네'},
  {deg:0,   name:'좌표'}];
let ladderIdx=-1;
let clusterDirty=true;
function markClusterDirty(){clusterDirty=true;}
controls.addEventListener('change',markClusterDirty);
addEventListener('resize',markClusterDirty);

/* 화면에 담기는 각도 — 계단을 고르는 잣대 */
function visibleSpanDeg(){
  if(VIEW==='2d'){
    const wh=2*Math.abs(camera.position.z)*Math.tan(camera.fov*D2R/2);
    return Math.min(180,wh/H2*180);}
  const d=Math.max(1.0001,camera.position.length());
  const horizon=2*Math.acos(Math.min(1,R/d))/D2R;          /* 지평선까지 */
  const fov=2*Math.atan(Math.tan(camera.fov*D2R/2))*(d-R)/R/D2R;
  return Math.max(2,Math.min(horizon,fov*2,180));}

function pickLadder(){
  const span=visibleSpanDeg();
  const want=span/14;                     /* 화면을 대략 14칸으로 */
  let i=0;while(i<LADDER.length-1&&LADDER[i].deg>want)i++;
  return i;}

/* 위경도 격자로 묶는다 — 한 번 지으면 계단이 바뀔 때까지 그대로 쓴다 */
function buildClusters(L,deg){
  if(deg<=0)return L.pts.map(p=>({la:p.la,lo:p.lo,m:[p]}));
  const cells=new Map();
  L.pts.forEach(p=>{
    const gy=Math.floor((p.la+90)/deg);
    /* 경도 칸은 위도에 따라 넓어진다 — 안 그러면 고위도에서 잘게 쪼개진다 */
    const wide=deg/Math.max(.15,Math.cos(p.la*D2R));
    const gx=Math.floor((p.lo+180)/wide);
    const k=gx+','+gy;
    let a=cells.get(k);if(!a){a=[];cells.set(k,a);}
    a.push(p);});
  const out=[];
  cells.forEach(a=>{
    let la=0,lo=0;const lo0=a[0].lo;
    a.forEach(p=>{la+=p.la;let dd=p.lo-lo0;
      if(dd>180)dd-=360;else if(dd<-180)dd+=360;lo+=lo0+dd;});
    out.push({la:la/a.length,lo:((lo/a.length+540)%360)-180,m:a});});
  return out;}

function rebuildClusters(){
  const deg=LADDER[ladderIdx].deg;
  layerGroups.forEach(L=>{L.clusters=buildClusters(L,deg);});
  const el=document.getElementById('lvl');
  if(el)el.textContent=LADDER[ladderIdx].name;}

const _v=new THREE.Vector3();
function recluster(){
  const li=pickLadder();
  if(li!==ladderIdx){ladderIdx=li;rebuildClusters();}
  const camDir=camera.position.clone().normalize();
  const back=1-journeyAlpha*.72;          /* 여정 모드에서는 한 발 물러선다 */
  layerGroups.forEach(L=>{
    L.g.visible=L.on;
    if(!L.on)return;
    if(!L.clusters)L.clusters=buildClusters(L,LADDER[ladderIdx].deg);
    L.pts.forEach(p=>{p.s.material.opacity=0;});
    L.hosts=[];
    let bi=0;
    L.clusters.forEach(c=>{
      /* 무리의 한가운데가 지구 뒷면이면 통째로 감춘다 — 숫자는 안 바뀐다 */
      const nrm=sphV3(c.la,c.lo,1);
      if(VIEW!=='2d'&&nrm.dot(camDir)<.03)return;
      const single=c.m.length===1;
      const host=single?c.m[0].s:(bi<L.bubbles.length?L.bubbles[bi++]:null);
      if(!host)return;
      if(!single){
        host.position.copy(blendV3(c.la,c.lo,PT_LIFT,MORPH));
        if(VIEW==='2d'){const base=flatV3(c.la,c.lo,PT_LIFT).x;
          host.position.x=base+W2*Math.round((camera.position.x-base)/W2);}
        const done=c.m.reduce((t,m)=>t+(stampsOf(keyOf(L,m.it)).length?1:0),0);
        host.material.map=bubbleTexture(c.m.length,L.rgb,done);
        host.material.needsUpdate=true;host.visible=true;
      }else if(VIEW==='2d'){
        const base=flatV3(c.la,c.lo,PT_LIFT).x;
        host.position.x=base+W2*Math.round((camera.position.x-base)/W2);}
      if(single){    /* 도장 찍은 곳 · 가고 싶은 곳 · 고른 곳은 다르게 보인다 */
        const k=keyOf(L,c.m[0].it);
        host.material=stampsOf(k).length?L.matStamped
          :isSaved(k)?L.matSaved
          :(selected&&selected.key===k)?L.matSel:L.matPlain;}
      L.hosts.push({host,c});
      /* 화면 밖이면 그린 값만 0으로 */
      _v.copy(host.position).project(camera);
      const onScreen=_v.z<=1&&_v.x>-1.3&&_v.x<1.3&&_v.y>-1.3&&_v.y<1.3;
      host.material.opacity=onScreen?.95*back:0;});
    for(;bi<L.bubbles.length;bi++)L.bubbles[bi].visible=false;});
  clusterDirty=false;}

function relayoutLayers(k){             /* 모핑: 점을 새 자리로 옮기고 다시 묶는다 */
  layerGroups.forEach(L=>L.pts.forEach(p=>p.s.position.copy(blendV3(p.la,p.lo,PT_LIFT,k))));
  markClusterDirty();}

/* ── 파고들면 지구본이 스스로 펼쳐진다 ──
   구를 계속 확대하면 결국 평면과 다를 게 없어지고, 그때부터는 회전보다 이동이 편하다.
   '도시' 계단에 닿으면 한 번만 지도로 넘어간다. 되돌아가는 건 사람이 누른다 —
   경계에서 자동으로 왔다 갔다 하면 조작을 빼앗긴 느낌이 든다. */
const AUTO_FLAT_LEVEL=4;                /* LADDER 인덱스 — '도시' */
let autoFlatDone=false;
function maybeAutoFlatten(){
  if(VIEW!=='3d'||morphAnim||MODE==='journey')return;
  if(ladderIdx>=AUTO_FLAT_LEVEL&&!autoFlatDone){
    autoFlatDone=true;
    setView('2d');}
  if(ladderIdx<AUTO_FLAT_LEVEL-1)autoFlatDone=false;}   /* 충분히 물러나면 다시 무장 */

/* 별이 있는 나라는 줌 단계를 올려 항상 보이게 한다.
   지도의 서열은 경제 규모가 아니라 '여기 갈 데가 있는가'여야 한다 */
function promoteStarredCountries(){
  const starred=new Set();
  layerGroups.forEach(L=>(L.def.items||[]).forEach(r=>{
    if(r.c)starred.add(String(r.c).toLowerCase());}));
  [['united states','united states of america'],['china','china'],
   ['czech republic','czechia']].forEach(pair=>{if(starred.has(pair[0]))starred.add(pair[1]);});
  labelObjs.forEach(o=>{if(o.key&&starred.has(o.key)&&o.tier>1)o.tier=1;});
  return starred.size;}

function paintLayerPanel(){
  document.getElementById('lrows').innerHTML=layerGroups.map((L,i)=>{
    const ct=L.mapped<L.total?L.mapped+' / '+L.total:String(L.total);
    return '<div class="lrow'+(L.on?'':' off')+'" data-i="'+i+'">'
      +'<span class="dot" style="background:'+L.def.color+'"></span>'
      +'<span class="nm">'+L.def.label+'</span><span class="ct">'+ct+'</span></div>';}).join('');
  document.querySelectorAll('#lrows .lrow').forEach(el=>
    el.addEventListener('click',()=>{
      const L=layerGroups[+el.dataset.i];L.on=!L.on;
      el.classList.toggle('off',!L.on);
      if(!L.on){L.pts.forEach(p=>{p.s.material.opacity=0;});
                L.bubbles.forEach(b=>{b.visible=false;});}
      markClusterDirty();}));
  const gap=layerGroups.filter(L=>L.mapped<L.total);
  document.getElementById('lprov').innerHTML=
    '출처 Wikidata · CC0 · 최종확인 '+((layerGroups[0]||{def:{}}).def.lastVerified||'—')
    +(gap.length?'<br>'+gap.map(L=>L.def.label+' '+L.mapped+'/'+L.total).join(' · ')+' — 좌표 있는 것만 표시':'')
    +'<br>우리가 평가하지 않습니다';}

function loadLayers(){
  Promise.all(LAYER_FILES.map(f=>fetch(f).then(r=>r.json()).catch(e=>{
    console.warn('[estela] 레이어 로드 실패',f,e);return null;})))
    .then(defs=>{
      defs.filter(Boolean).forEach(d=>addLayer(d));
      promoteStarredCountries();
      paintLayerPanel();
      const el=document.getElementById('nstar');
      if(el)el.textContent=layerGroups.reduce((a,L)=>a+L.total,0);
      relayoutLayers(MORPH);paintMine();paintJourney();});}

/* ══════════════════════════════════════════════════════════════════
   여정 (§5.3) — 도장(사실)과 여정선(서사)은 다른 물건이다.
   날짜가 있는 별은 순서대로 꿰이고, 날짜가 없는 별은 "떠 있는 별"로 남는다.
   ⚠️ 아래 좌표는 전부 도시 좌표다. 식당·등급·가이드 데이터는 이 파일에 없다 (§4, §F).
   P1에서 정본 스냅샷이 들어오면 이 배열만 갈아끼우면 된다.
   ══════════════════════════════════════════════════════════════════ */
/* with: 'solo' 나 혼자 · 'together' 함께 갔고 서로 확인됨 · 'apart' 여럿이 따로 갔음.
   함께 여부는 §5.4대로 상호 확인만이 판정한다 — 선이 겹친다고 함께 간 것이 아니다 */
/* 한 곳을 여러 번 갈 수 있다. 장소는 하나지만 도장은 간 횟수만큼 찍힐다 —
   진행률은 '간 장소 수'로 세고, 여정선은 '간 횟수'만큼 그곳을 다시 지난다.
   [도시, 위도, 경도, [[날짜, 동행상태], ...]] */
const JOURNEY=[
  ['TOKYO',        35.68, 139.70,[['2023-05','together'],['2025-01','solo']]],
  ['PARIS',        48.86,   2.35,[['2023-11','solo']]],
  ['SAN SEBASTIÁN',43.32,  -1.98,[['2024-04','apart']]],
  ['LIMA',        -12.05, -77.04,[['2024-09','solo']]],
  ['NEW YORK',     40.71, -74.01,[['2025-02','together']]],
  ['SEOUL',        37.57, 126.98,[['2025-08','solo'],['2026-03','together']]]];
/* 날짜 순으로 펼친 방문 목록 — 여정선이 꾰고 지나갈 실의 순서 */
const VISITS=JOURNEY.flatMap(p=>p[3].map(v=>({n:p[0],la:p[1],lo:p[2],d:v[0],w:v[1]})))
  .sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
const FLOATING=[           /* 떠 있는 별 — 갔지만 언제였는지 기억이 안 나는 곳 (§5.3.3) */
  ['COPENHAGEN',   55.68,  12.57],
  ['HONG KONG',    22.30, 114.17]];
const EMPTY_SLOTS=4;       /* 아직 안 간 칸 — 빈칸이 남아 있는 게 보여야 채우고 싶어진다 */

const journeyG=new THREE.Group();stage.add(journeyG);
const jStars=[];           /* {la,lo,mesh,lift} — 모핑 때 자리를 다시 잡아야 한다 */
const jRings=[];           /* 함께 간 별에 두르는 고리 */
let jLine=null;

function greatCircle(la1,lo1,la2,lo2,steps){
  /* 두 점 사이 대권(great circle) — 지구 위 실제 최단 경로. 지도에서는 곡선으로 보인다 */
  const a=sphV3(la1,lo1,1),b=sphV3(la2,lo2,1);
  const out=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const v=a.clone().lerp(b,t).normalize();          /* 구면 보간 */
    const la=Math.asin(THREE.MathUtils.clamp(v.y,-1,1))/D2R;
    let lo=Math.atan2(v.z,-v.x)/D2R-180;
    lo=((lo+540)%360)-180;
    const lift=Math.sin(t*Math.PI)*.055;              /* 가운데가 들리는 활 모양 */
    out.push([la,lo,lift]);}
  return out;}

function buildJourney(){
  /* 여정선: 대권 궤적을 잘게 쪼개 LineSegments로. 구·평면 두 벌 좌표를 같이 굽는다 */
  const v0=[],v1=[];
  for(let s=0;s<VISITS.length-1;s++){
    const A=VISITS[s],B=VISITS[s+1];
    /* 같은 곳을 연이어 두 번 갔으면 이을 선이 없다 */
    if(Math.abs(A.la-B.la)<1e-6&&Math.abs(A.lo-B.lo)<1e-6)continue;
    const pts=greatCircle(A.la,A.lo,B.la,B.lo,48);
    let unwrap=0;                                     /* 평면용 경도 연속화 */
    for(let i=0;i<pts.length-1;i++){
      const [laA,loA,lfA]=pts[i];
      let [laB,loB,lfB]=pts[i+1];
      const a0=sphV3(laA,loA,R+lfA),b0=sphV3(laB,loB,R+lfB);
      v0.push(a0.x,a0.y,a0.z,b0.x,b0.y,b0.z);
      /* 평면: ±180°를 넘어가면 지도 밖으로 계속 흘려보낸다. 좌우 복제본이 이어받는다 */
      const loAu=loA+unwrap;
      let d=loB-loA;
      if(d>180)unwrap-=360; else if(d<-180)unwrap+=360;
      const loBu=loB+unwrap;
      const a1=flatV3(laA,loAu,R+lfA),b1=flatV3(laB,loBu,R+lfB);
      v1.push(a1.x,a1.y,a1.z,b1.x,b1.y,b1.z);}}
  const jp0=new Float32Array(v0),jp1=new Float32Array(v1);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(jp0,3));
  g.setAttribute('aP1',new THREE.BufferAttribute(jp1,3));
  g.userData={p0:jp0,p1:jp1};
  jLine=new THREE.LineSegments(g,lineMat(0x7A2233,0,true));
  jLine.frustumCulled=false;jLine.renderOrder=14;
  journeyG.add(jLine);
  /* 별: 다녀온 곳 = 켜진 별. 우리가 그린 별이지 남의 도안이 아니다 (§3.1) */
  const starGeo=new THREE.SphereGeometry(.010,12,12);
  const mkStar=(la,lo,col,lift)=>{
    const m=new THREE.Mesh(starGeo,new THREE.MeshBasicMaterial({
      color:col,transparent:true,opacity:0,depthTest:false}));
    m.renderOrder=15;
    m.position.copy(blendV3(la,lo,R+lift,MORPH));
    journeyG.add(m);
    jStars.push({la,lo,mesh:m,lift});
    return m;};
  JOURNEY.forEach(j=>mkStar(j[1],j[2],0x7A2233,.004));   /* 별은 장소당 하나 */
  FLOATING.forEach(f=>mkStar(f[1],f[2],0x8C8175,.028)); /* 떠 있는 별 — 지면에서 살짝 띄운다 */
  /* 고리: 관계를 그래프가 아니라 지도 위에 그린다 (§5.4의 다섯 상태).
     이어진 고리 = 함께 감 · 끊긴 고리 = 여럿이 따로 감 · 고리 없음 = 나 혼자 */
  JOURNEY.forEach(j=>{
    /* 여러 번 갔으면 그중 한 번이라도 함께갔으면 이어진 고리다 */
    const ws=j[3].map(v=>v[1]);
    if(ws.includes('together'))buildRing(j[1],j[2],2.6,false);
    else if(ws.includes('apart'))buildRing(j[1],j[2],2.6,true);});}
  /* 여권은 여기서 그리지 않는다 — 내 기록(store)이 아래에서 선언되기 때문이다 */

/* 구면 위의 작은 원 — 위경도로 걸어 그리므로 모핑을 그대로 탄다 */
function buildRing(la0,lo0,degR,dashed){
  const N=72,v0=[],v1=[],lift=.006;
  const coslat=Math.max(.12,Math.cos(la0*D2R));
  const pt=t=>{const a=t/N*Math.PI*2;
    return [la0+degR*Math.cos(a), lo0+degR*Math.sin(a)/coslat];};
  for(let i=0;i<N;i++){
    if(dashed&&i%2)continue;                      /* 끊긴 고리 */
    const [laA,loA]=pt(i),[laB,loB]=pt(i+1);
    const a0=sphV3(laA,loA,R+lift),b0=sphV3(laB,loB,R+lift);
    v0.push(a0.x,a0.y,a0.z,b0.x,b0.y,b0.z);
    const a1=flatV3(laA,loA,R+lift),b1=flatV3(laB,loB,R+lift);
    v1.push(a1.x,a1.y,a1.z,b1.x,b1.y,b1.z);}
  const p0=new Float32Array(v0),p1=new Float32Array(v1);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p0,3));
  g.setAttribute('aP1',new THREE.BufferAttribute(p1,3));
  g.userData={p0,p1};
  const l=new THREE.LineSegments(g,lineMat(0x6E7355,0,true)); /* 올리브 = 함께 */
  l.frustumCulled=false;l.renderOrder=13;
  journeyG.add(l);jRings.push(l);
  return l;}

buildJourney();

let journeyAlpha=0,jTween=null;        /* 여정 레이어의 등장·퇴장 */
function tweenJourney(to,dur){jTween={from:journeyAlpha,to,t0:performance.now(),dur:dur||520};}

/* ── 모핑: 지구본이 펼쳐지고(→평면) 접힌다(→구) ── */
function setStageMorph(k){
  MORPH=k;
  setLerpGeo(baseGeo,BP0,BP1,k);      /* 바탕 격자만 CPU — 5.6만 개라 가볍다 */
  setLineK(innerL,k);setLineK(coastL,k);setLineK(jLine,k); /* 선은 GPU가 접는다 */
  jRings.forEach(l=>setLineK(l,k));
  relayoutLayers(k);
  labelObjs.forEach(o=>o.s.position.copy(blendV3(o.la,o.lo,R*1.012,k)));
  jStars.forEach(s=>s.mesh.position.copy(blendV3(s.la,s.lo,R+s.lift,k)));
  const d3=new THREE.Object3D();
  ALLCITY.forEach((c2,i)=>{d3.position.copy(blendV3(c2[1],c2[2],R*1.0025,k));

let morphAnim=null;
function startMorph(k1,vFinal){

/* ── 카메라: 뷰별 조작 ── */
function configCamera(){
  if(VIEW==='2d'){
    /* 왼쪽 드래그 = 끌기(팬). 회전만 꺼두면 왼쪽 버튼이 죽어 있게 된다 */
    controls.enableRotate=false;controls.enablePan=true;controls.screenSpacePanning=true;
    controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
    controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_PAN};
    controls.autoRotate=false;
    controls.minDistance=.012;controls.maxDistance=4;   /* 화면 세로 ≈ 90km — 도시 하나 크기 */
    controls.target.set(camera.position.x,camera.position.y,0);
    camera.position.z=Math.max(camera.position.z,1.2);
    camera.lookAt(controls.target);
  }else{
    controls.enableRotate=true;controls.enablePan=false;
    controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};
    controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
    controls.autoRotate=AUTOROT;
    controls.minDistance=1.008;controls.maxDistance=5.5; /* 고도 ≈ 51km (기존 2,548km의 1/50) */
    controls.target.set(0,0,0);
    if(camera.position.length()<1.5)camera.position.set(0,.5,3.8);}}

/* 가까이 갈수록 앞유리(near plane)를 좁힌다 — 안 그러면 지표가 잘려 나가고,
   반대로 항상 좁혀두면 깊이 정밀도가 떨어져 국경선이 지면과 싸운다(z-fighting) */
function updateNear(){
  const d=VIEW==='2d'?Math.abs(camera.position.z):Math.max(0,camera.position.length()-R);
  const n=THREE.MathUtils.clamp(d*.3,.0008,.05);
  if(Math.abs(camera.near-n)>n*.15){camera.near=n;camera.updateProjectionMatrix();}}

/* ── 지도도 지구본처럼 계속 흐른다 ──
   무대가 ±W2에 복제돼 있으므로 카메라 x를 W2만큼 되감으면 화면은 완전히 동일하다.
   이음매 없이 영원히 서쪽으로 흘러가는 지도가 된다 */
/* 지구본은 autoRotateSpeed .22로 한 바퀴에 약 273초가 걸린다.
   지도도 같은 속도로 느껴지도록 W2(=지구 한 바퀴)를 273초에 지나가게 맞춘다 */
const DRIFT=W2/273;
let userHold=0;                       /* 사람이 만지는 동안은 흐름을 멈춘다 */
controls.addEventListener('start',()=>{userHold=1;});
controls.addEventListener('end',()=>{userHold=performance.now();});
function driftMap(dt){
  if(VIEW!=='2d'||!AUTOROT||morphAnim)return;
  if(userHold===1)return;                                   /* 잡고 있는 중 */
  if(userHold&&performance.now()-userHold<2500)return;      /* 놓은 뒤 2.5초는 쉰다 */
  const dx=DRIFT*dt;
  camera.position.x+=dx;controls.target.x+=dx;
  if(camera.position.x>W2/2){camera.position.x-=W2;controls.target.x-=W2;} /* 되감기 */}

/* ── 뷰 전환: 3D↔지도는 접고 펴기, 여정은 같은 투영 위에 얹기 ── */

/* ────────────────────────────────────────────────────────────────
   ESTELA MOUNT POINTS — the star layers are still empty, on purpose.
   P1  canon layers  : static JSON snapshots (Michelin, Blue Ribbon, ...)
                       → star points on `stage`, colour by layer, size by
                         the 3-step intensity of §3.1, one toggleable
                         THREE.Group per layer. Give every point the same
                         {la,lo} + blendV3 treatment as `jStars` so it folds
                         with the map.
   P2  camera        : country click → ease-in to city → restaurant cards.
   P3  journey line  : replace the JOURNEY / FLOATING sample arrays above
                       with the member's own visits. The rendering is done.
   Rule (§4): snapshots are static files in this repo. No live scraping,
   no runtime calls to any guide's servers. Every record carries its
   source layer and a last-verified date.

function updateLabels(){
  const camDir=camera.position.clone().normalize();
  const dist=VIEW==='2d'?camera.position.z+1.2:camera.position.length();
  labelObjs.forEach(o=>{
    const facing=VIEW==='2d'?1:o.normal.dot(camDir); /* 1=정면 · 0=림 · 음수=뒷면 */
    const tierOn=o.tier===1||(o.tier===2&&dist<2.5)||(o.tier===3&&dist<1.85)
      ||(o.tier===4&&dist<1.95)||(o.tier===5&&dist<1.6);
    const fade=VIEW==='2d'?1:THREE.MathUtils.smoothstep(facing,.12,.35); /* 수평선 페이드 */
    o.s.material.opacity=tierOn?fade*.95:0;});}

/* ══════════════════════════════════════════════════════════════════
   내 기록 — 브라우저에 저장한다. 서버는 P4에 온다.
   도장은 사실이고 여러 번 찍힌다. 가고 싶은 곳은 후보일 뿐이다.
   ══════════════════════════════════════════════════════════════════ */
const STORE_KEY='estela.v1';
const store=(()=>{
  let s={stamps:{},saved:{}};
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)s=Object.assign(s,JSON.parse(raw));}catch(e){}
  return s;})();
function saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}}
function keyOf(L,it){return L.def.layer+'|'+(it.q||it.n);}
function stampsOf(k){return store.stamps[k]||[];}
function isSaved(k){return !!store.saved[k];}
function todayISO(){const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function addStamp(k,when){
  const a=store.stamps[k]||(store.stamps[k]=[]);
  a.push({d:when||todayISO()});
  a.sort((x,y)=>x.d<y.d?-1:1);saveStore();}
function removeLastStamp(k){
  const a=store.stamps[k];if(!a||!a.length)return;
  a.pop();if(!a.length)delete store.stamps[k];saveStore();}
function toggleSaved(k){
  if(store.saved[k])delete store.saved[k];else store.saved[k]=1;saveStore();}
function myCounts(){
  const places=Object.keys(store.stamps).length;
  const visits=Object.values(store.stamps).reduce((a,b)=>a+b.length,0);
  return {places,visits,saved:Object.keys(store.saved).length};}

/* ── 고르기 ── 낱개 점은 카드를 열고, 묶음은 한 계단 파고든다 ── */
const ray=new THREE.Raycaster();
const ndc=new THREE.Vector2();
let selected=null;                      /* {L,it,key} */
let downX=0,downY=0,downT=0;
renderer.domElement.addEventListener('pointerdown',e=>{
  downX=e.clientX;downY=e.clientY;downT=performance.now();});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.abs(e.clientX-downX)>5||Math.abs(e.clientY-downY)>5)return; /* 끌기였다 */
  if(performance.now()-downT>600)return;
  ndc.x=(e.clientX/innerWidth)*2-1;ndc.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  let best=null,bestD=Infinity;
  layerGroups.forEach(L=>{
    if(!L.on||!L.hosts)return;
    L.hosts.forEach(h=>{
      if(!h.host.visible||h.host.material.opacity<.05)return;
      const hit=ray.intersectObject(h.host,false);
      if(hit.length&&hit[0].distance<bestD){bestD=hit[0].distance;best={L,...h};}});});
  if(!best){closeCard();return;}
  if(best.c.m.length>1)flyTo(best.c.la,best.c.lo);
  else selectPlace(best.L,best.c.m[0].it);});

/* 묶음을 누르면 그 자리로 한 계단 내려간다 */
let flyAnim=null;
function flyTo(la,lo){
  const step=LADDER[Math.min(LADDER.length-1,ladderIdx+1)];
  if(VIEW==='2d'){
    const p=flatV3(la,lo,R);
    const z=Math.max(.02,camera.position.z*.45);
    flyAnim={mode:'flat',t0:performance.now(),dur:900,
      from:camera.position.clone(),to:new THREE.Vector3(p.x,p.y,z)};
  }else{
    const d=Math.max(1.02,camera.position.length()*.55);
    flyAnim={mode:'orbit',t0:performance.now(),dur:900,
      from:camera.position.clone(),to:sphV3(la,lo,d)};}
  controls.enabled=false;}
function stepFly(now){
  if(!flyAnim)return;
  const p=Math.min(1,(now-flyAnim.t0)/flyAnim.dur);
  const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
  if(flyAnim.mode==='orbit'){
    const a=flyAnim.from.clone().normalize(),b=flyAnim.to.clone().normalize();
    const len=flyAnim.from.length()+(flyAnim.to.length()-flyAnim.from.length())*e;
    camera.position.copy(a.lerp(b,e).normalize().multiplyScalar(len));
    camera.lookAt(0,0,0);
  }else{
    camera.position.lerpVectors(flyAnim.from,flyAnim.to,e);
    controls.target.set(camera.position.x,camera.position.y,0);
    camera.lookAt(controls.target);}
  markClusterDirty();
  if(p>=1){flyAnim=null;controls.enabled=true;configCamera();}}

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,

/* ── 여정 화면 ── 지구본은 뒤로 물러나 배경이 되고, 기록이 무대를 차지한다.
   Batavia의 ENGINE 화면과 같은 구조: 전체 화면 오버레이 + 가운데 정렬 다단 그리드. */
function rot(i){return (((i*2654435761)%1000)/1000*8-4).toFixed(2)+'deg';}

function myPlaces(){                    /* 내가 도장 찍은 곳을 레이어에서 되찾는다 */
  const out=[];
  layerGroups.forEach(L=>L.pts.forEach(p=>{
    const k=keyOf(L,p.it),st=stampsOf(k);
    if(st.length)out.push({L,it:p.it,key:k,st});}));
  out.sort((a,b)=>{const x=a.st[a.st.length-1].d,y=b.st[b.st.length-1].d;
    return x<y?-1:x>y?1:0;});
  return out;}

function stat(v,label){return '<span class="st"><b>'+v+'</b>'+label+'</span>';}

let frames=0,fpsT=performance.now(),lastT=performance.now();

function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;

    journeyAlpha=jTween.from+(jTween.to-jTween.from)*p;
    if(p>=1)jTween=null;}
  /* 레이어 묶음은 카메라가 움직였을 때만 다시 계산한다 */
  if(clusterDirty||jTween){recluster();maybeAutoFlatten();}
  setLineO(jLine,journeyAlpha*.90);
  jRings.forEach(l=>setLineO(l,journeyAlpha*.85));
  jStars.forEach(s=>{s.mesh.material.opacity=journeyAlpha;});
  const dim=1-journeyAlpha*.55;                       /* 여정에서는 지도가 한 발 물러선다 */
  setLineO(innerL,O_INNER*dim);setLineO(coastL,O_COAST*dim);
  cityIM.material.opacity=O_CITY*dim;
  atmMat.uniforms.a.value=(1-MORPH)*dim;
  atmMesh.visible=MORPH<.99;

  stepFly(now);
  if(controls.enabled){driftMap(dt);controls.update();}
  updateNear();
  updateLabels();
  renderer.render(scene,camera);
  frames++;if(now-fpsT>1000){fpsEl.textContent=frames;frames=0;fpsT=now;}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
